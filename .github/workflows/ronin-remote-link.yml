name: Ronin Remote Link v0.2

on:
  workflow_dispatch:
  push:
    branches:
      - ronin-remote-link-v0.2.0
    paths:
      - 'ronin-remote-link/**'
      - '.github/workflows/ronin-remote-link.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish native Windows package
        shell: pwsh
        run: |
          dotnet publish .\ronin-remote-link\windows\RoninRemoteLink\RoninRemoteLink.csproj -c Release -r win-x64 --self-contained true -o .\out\windows /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:DebugType=None
          Copy-Item .\ronin-remote-link\README.md .\out\windows\README.md
          Copy-Item .\ronin-remote-link\THIRD_PARTY_NOTICES.md .\out\windows\THIRD_PARTY_NOTICES.md
          $hash = (Get-FileHash .\out\windows\RoninRemoteLink.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  RoninRemoteLink.exe" | Set-Content .\out\windows\SHA256SUMS.txt
          Compress-Archive -Path .\out\windows\* -DestinationPath .\out\Ronin-Remote-Link-Windows-v0.2.0.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Ronin-Remote-Link-Windows-v0.2.0
          path: out/Ronin-Remote-Link-Windows-v0.2.0.zip
          if-no-files-found: error

  android:
    name: Android phone + tablet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 16 SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build phone and tablet APKs
        working-directory: ronin-remote-link/android
        run: gradle --no-daemon :app:assemblePhoneDebug :app:assembleTabletDebug
      - name: Verify and stage APKs
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          PHONE="ronin-remote-link/android/app/build/outputs/apk/phone/debug/app-phone-debug.apk"
          TABLET="ronin-remote-link/android/app/build/outputs/apk/tablet/debug/app-tablet-debug.apk"
          "$APKSIGNER" verify --verbose "$PHONE"
          "$APKSIGNER" verify --verbose "$TABLET"
          mkdir -p out/android
          cp "$PHONE" out/android/Ronin-Remote-Link-Phone-v0.2.0.apk
          cp "$TABLET" out/android/Ronin-Remote-Link-Tablet-v0.2.0.apk
          sha256sum out/android/*.apk > out/android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ronin-Remote-Link-Phone-v0.2.0
          path: out/android/Ronin-Remote-Link-Phone-v0.2.0.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Ronin-Remote-Link-Tablet-v0.2.0
          path: out/android/Ronin-Remote-Link-Tablet-v0.2.0.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Ronin-Remote-Link-Android-Checksums-v0.2.0
          path: out/android/SHA256SUMS.txt
          if-no-files-found: error

  server:
    name: Self-host server bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose configuration
        run: |
          cp ronin-remote-link/server/.env.example ronin-remote-link/server/.env
          docker compose -f ronin-remote-link/server/compose.yml --env-file ronin-remote-link/server/.env config >/dev/null
          rm ronin-remote-link/server/.env
      - name: Package server files
        run: |
          chmod +x ronin-remote-link/server/*.sh
          mkdir -p out
          cp -R ronin-remote-link/server out/server
          cp ronin-remote-link/README.md out/server/PROJECT_README.md
          cp ronin-remote-link/THIRD_PARTY_NOTICES.md out/server/THIRD_PARTY_NOTICES.md
          cd out
          zip -r Ronin-Remote-Link-Server-v0.2.0.zip server
          sha256sum Ronin-Remote-Link-Server-v0.2.0.zip > Server-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ronin-Remote-Link-Server-v0.2.0
          path: |
            out/Ronin-Remote-Link-Server-v0.2.0.zip
            out/Server-SHA256SUMS.txt
          if-no-files-found: error

  bundle:
    name: Complete v0.2 bundle
    runs-on: ubuntu-latest
    needs: [windows, android, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Ronin-Remote-Link-Windows-v0.2.0
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: Ronin-Remote-Link-Phone-v0.2.0
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: Ronin-Remote-Link-Tablet-v0.2.0
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: Ronin-Remote-Link-Android-Checksums-v0.2.0
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: Ronin-Remote-Link-Server-v0.2.0
          path: bundle
      - name: Add install guide and package
        run: |
          cp ronin-remote-link/INSTALL-FIRST.txt bundle/INSTALL-FIRST.txt
          cp ronin-remote-link/README.md bundle/PROJECT-README.md
          cp ronin-remote-link/THIRD_PARTY_NOTICES.md bundle/THIRD_PARTY_NOTICES.md
          cd bundle
          sha256sum Ronin-Remote-Link-Windows-v0.2.0.zip Ronin-Remote-Link-Phone-v0.2.0.apk Ronin-Remote-Link-Tablet-v0.2.0.apk Ronin-Remote-Link-Server-v0.2.0.zip > BUNDLE-SHA256SUMS.txt
          zip -r ../Ronin-Remote-Link-v0.2.0-Bundle.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Ronin-Remote-Link-v0.2.0-Bundle
          path: Ronin-Remote-Link-v0.2.0-Bundle.zip
          if-no-files-found: error
