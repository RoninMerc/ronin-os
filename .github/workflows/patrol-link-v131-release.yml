name: Patrol Link 1.1.21 release package
on:
  push:
    branches: ['patrol-link-v131-release']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: patrol-link-v131-release
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct tested v1.1.21 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/patrol-v131 /tmp/deliver131/evidence
          cat .patrolbuild/base.part0{0,1,2,3,4,5} | base64 -d > /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/patrol-v131
          cat .patrolbuild/overlay.part0{0,1,2} | base64 -d > /tmp/overlay.tgz
          tar -xzf /tmp/overlay.tgz -C /tmp/patrol-v131
          J=/tmp/patrol-v131/app/src/main/java/au/com/roningroup/patrollink
          cp .patrolbuild/PatrolEngine.java .patrolbuild/MainActivity.java "$J/"
          python3 .patrolbuild/v115-patch.py /tmp/patrol-v131
          mkdir -p /tmp/patrol-v131/app/src/androidTest/java/au/com/roningroup/patrollink
          cp .patrolbuild/RefreshLifecycleTest.java /tmp/patrol-v131/app/src/androidTest/java/au/com/roningroup/patrollink/
          python3 .patrolbuild/v115-finalize.py /tmp/patrol-v131
          python3 .patrolbuild/v116-patch.py /tmp/patrol-v131
          cp .patrolbuild/TlsPolicy.java "$J/"
          cp .patrolbuild/TlsPolicyTest.java /tmp/patrol-v131/app/src/test/java/au/com/roningroup/patrollink/
          cp .patrolbuild/TlsRecoveryTest.java /tmp/patrol-v131/app/src/androidTest/java/au/com/roningroup/patrollink/
          python3 .patrolbuild/v117-patch.py /tmp/patrol-v131
          python3 .patrolbuild/v121/patch.py /tmp/patrol-v131
          python3 .patrolbuild/v122/patch.py /tmp/patrol-v131
          python3 .patrolbuild/v123/patch.py /tmp/patrol-v131
          python3 .patrolbuild/v124/patch.py /tmp/patrol-v131
          python3 .patrolbuild/v125/patch.py /tmp/patrol-v131
          python3 .patrolbuild/v126/patch.py /tmp/patrol-v131
          python3 .patrolbuild/v127/patch.py /tmp/patrol-v131
          python3 .patrolbuild/v128/patch.py /tmp/patrol-v131
          python3 .patrolbuild/v129/patch.py /tmp/patrol-v131
          mkdir -p /tmp/patrol-v131/app/src/main/assets/exact
          cp .patrolbuild/v123/base_phrases.txt /tmp/patrol-v131/app/src/main/assets/exact/base_phrases.txt
          python3 .patrolbuild/v130/patch.py /tmp/patrol-v131
          python3 .patrolbuild/v131/patch.py /tmp/patrol-v131

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/patrol-v131')
          java=root/'app/src/main/java/au/com/roningroup/patrollink'
          assert "versionName '1.1.21'" in (root/'app/build.gradle').read_text()
          engine=(java/'PatrolEngine.java').read_text()
          tracker=(java/'CheckpointTracker.java').read_text()
          main=(java/'MainActivity.java').read_text()
          assert 'setInitialScale(135)' in engine
          assert 'pageHistory(boolean right)' in engine
          assert 'Rec Center 2 Gym' in tracker
          assert 'Rec Center 2 Barbecue Area' in tracker
          assert 'Silvertracker page  ›' in main
          PY

      - name: Build release APK
        working-directory: /tmp/patrol-v131
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify and package release
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/deliver131/Ronin-Patrol-Link-v1.1.21-Browser-Rec-Centre-Fix.apk
          cp /tmp/patrol-v131/app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > /tmp/deliver131/evidence/APK-SIGNATURE.txt
          grep -q 'Signer #1 certificate SHA-256 digest: ff91d55288f1a7160e13c1affcdfef9bba89d24b2a74b0e4d7f7e923569e9332' /tmp/deliver131/evidence/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/deliver131/evidence/PACKAGE.txt
          sha256sum "$APK" > /tmp/deliver131/evidence/SHA256SUMS.txt

          cat > /tmp/deliver131/Ronin-Patrol-Link-v1.1.21-VERIFICATION.txt <<'EOF'
RONIN PATROL LINK 1.1.21 — SILVERTRACKER BROWSER + REC CENTRE FIX

FULL TEST PROVENANCE
Full CI run 36441982530 passed:
- source reconstruction
- compile and unit tests
- Chromium browser/parser regressions
- Android 16 instrumentation regressions
The prior run failed only in its report-generation Python string after all those test steps had passed.
This release workflow rebuilt the identical application source and independently verified the APK signature.

SILVERTRACKER DISPLAY
The screenshot showed current Issue Monitor rows, so the visible problem was WebView/desktop-page scaling rather than a failed internet load.
The Silvertracker desktop page now opens at a readable 135% initial scale, remains pannable/pinch-zoomable, and no longer depends on tiny website controls for paging.
Large native left/right "Silvertracker page" buttons mirror the website pager.
Automatic polling remains paused while Shift History is open, so paging is not interrupted.

CHECKPOINT NAMES
The two recreation-centre checkpoint labels are now:
- Rec Center 2 Gym
- Rec Center 2 Barbecue Area
Internal rec1/rec2 storage IDs are preserved so current shift counts are not discarded by this update.

SHIFT TALLY
The tally still starts at the most recent 18:00 site-time shift boundary.
Every loaded history page is de-duplicated by Issue ID and guard + checkpoint + recorded timestamp.

INSTALL
Install over v1.1.20. Do not uninstall or clear app data.

TEST BOUNDARY
CI did not use the user's authenticated live Silvertracker account or physical handset.
EOF

      - name: Publish direct APK on release branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp /tmp/deliver131/Ronin-Patrol-Link-v1.1.21-Browser-Rec-Centre-Fix.apk dist/Ronin-Patrol-Link-v1.1.21-Browser-Rec-Centre-Fix.apk
          git config user.name "Ronin Patrol Link Builder"
          git config user.email "actions@users.noreply.github.com"
          git add dist/Ronin-Patrol-Link-v1.1.21-Browser-Rec-Centre-Fix.apk
          if git diff --cached --quiet; then
            echo "Direct APK already current."
          else
            git commit -m "Publish Patrol Link v1.1.21 direct APK [skip ci]"
            git push origin HEAD:patrol-link-v131-release
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Ronin-Patrol-Link-v1.1.21-verified
          path: |
            /tmp/deliver131/Ronin-Patrol-Link-v1.1.21-Browser-Rec-Centre-Fix.apk
            /tmp/deliver131/Ronin-Patrol-Link-v1.1.21-VERIFICATION.txt
          retention-days: 7
