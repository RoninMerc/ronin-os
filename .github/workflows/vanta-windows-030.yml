name: Ronin Vanta Windows 0.3.0 - Desktop Agent

on:
  push:
    branches: ['build/vanta-windows-codex-030']
    paths:
      - 'vanta/windows-030/**'
      - '.github/workflows/vanta-windows-030.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vanta-windows-030-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Reconstruct verified native Windows baseline
        shell: pwsh
        run: |
          python vanta/windows-native/materialize.py
          python vanta/windows-native/review.py
          python vanta/windows-native/apply_tests.py
          if(Test-Path vanta/windows-native/quality_review.py){python vanta/windows-native/quality_review.py}
          if(Test-Path vanta/windows-native/test_review.py){python vanta/windows-native/test_review.py}
          python vanta/windows-native/finish.py
          if(Test-Path vanta/windows-native/last_review.py){python vanta/windows-native/last_review.py}
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Reconstruct and verify exact Vanta 0.3 source overlay
        shell: pwsh
        run: |
          python vanta/windows-030/materialize.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python vanta/windows-030/compiler_repair.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          if(!(Test-Path ronin-vanta-windows/docs/CODEX_EQUIVALENT.md)){throw 'Codex-equivalent contract missing'}
          if(-not (Select-String -Quiet -Path ronin-vanta-windows/Directory.Build.props -Pattern '<Version>0.3.0</Version>')){throw '0.3.0 version not applied'}
          if(!(Test-Path ronin-vanta-windows/src/Vanta.Core/Agentic.cs)){throw 'Agentic core missing'}
          if(!(Test-Path ronin-vanta-windows/src/Vanta.Windows/AgentPages.cs)){throw 'Desktop agent pages missing'}

      - name: Compile Vanta Windows 0.3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet build ronin-vanta-windows/src/Vanta.Windows/Vanta.Windows.csproj -c Release --nologo 2>&1 | Tee-Object artifacts/build.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Compile test harness
        shell: pwsh
        run: |
          dotnet build ronin-vanta-windows/tests/Vanta.Tests/Vanta.Tests.csproj -c Release --nologo 2>&1 | Tee-Object artifacts/test-build.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Run native Vanta tests
        shell: pwsh
        run: |
          dotnet run --project ronin-vanta-windows/tests/Vanta.Tests/Vanta.Tests.csproj -c Release --no-build -- artifacts/qa 2>&1 | Tee-Object artifacts/test-run.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: |
          dotnet publish ronin-vanta-windows/src/Vanta.Windows/Vanta.Windows.csproj -c Release -r win-x64 --self-contained true -o artifacts/app --nologo 2>&1 | Tee-Object artifacts/publish.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          if(!(Test-Path artifacts/app/RoninVanta.exe)){throw 'Published executable missing'}

      - name: Build and smoke-test Windows installer
        shell: pwsh
        run: |
          & vanta/windows-030/package.ps1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Preserve exact source and checksums
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -c "from pathlib import Path;import zipfile;root=Path('ronin-vanta-windows');z=zipfile.ZipFile('artifacts/Ronin-Vanta-Windows-0.3.0-Source.zip','w',zipfile.ZIP_DEFLATED);[(z.write(p,'ronin-vanta-windows/'+str(p.relative_to(root)))) for p in root.rglob('*') if p.is_file() and not {'bin','obj'}.intersection(p.parts)];z.close()"
          if(Test-Path artifacts/installer/Ronin-Vanta-Windows-0.3.0-Setup.exe){Get-FileHash artifacts/installer/Ronin-Vanta-Windows-0.3.0-Setup.exe | Format-List | Out-File artifacts/Ronin-Vanta-Windows-0.3.0-SHA256.txt}
          if(Test-Path artifacts/qa/private-test-profiles){Remove-Item artifacts/qa/private-test-profiles -Recurse -Force}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-vanta-windows-0.3.0
          path: |
            artifacts/*.log
            artifacts/*.zip
            artifacts/*.txt
            artifacts/qa/
            artifacts/installer/
          if-no-files-found: error
