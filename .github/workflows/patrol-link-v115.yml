name: Patrol Link 1.1.5 lifecycle regression
on:
  push:
    branches: ['patrol-link-v115-build']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Reconstruct and patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/patrol-v115 /tmp/deliver115
          cat .patrolbuild/base.part0{0,1,2,3,4,5} | base64 -d > /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/patrol-v115
          cat .patrolbuild/overlay.part0{0,1,2} | base64 -d > /tmp/overlay.tgz
          tar -xzf /tmp/overlay.tgz -C /tmp/patrol-v115
          cp .patrolbuild/PatrolEngine.java /tmp/patrol-v115/app/src/main/java/au/com/roningroup/patrollink/PatrolEngine.java
          cp .patrolbuild/MainActivity.java /tmp/patrol-v115/app/src/main/java/au/com/roningroup/patrollink/MainActivity.java
          python3 .patrolbuild/v115-patch.py /tmp/patrol-v115
          mkdir -p /tmp/patrol-v115/app/src/androidTest/java/au/com/roningroup/patrollink
          cp .patrolbuild/RefreshLifecycleTest.java /tmp/patrol-v115/app/src/androidTest/java/au/com/roningroup/patrollink/
          python3 .patrolbuild/v115-finalize.py /tmp/patrol-v115
          grep -q 'versionCode 115' /tmp/patrol-v115/app/build.gradle
          grep -q "versionName '1.1.5'" /tmp/patrol-v115/app/build.gradle
          node --check /tmp/patrol-v115/app/src/main/assets/extract.js
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests and APKs
        working-directory: /tmp/patrol-v115
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Parser regressions in Chromium
        shell: bash
        run: |
          python3 -m venv /tmp/domvenv
          /tmp/domvenv/bin/pip -q install playwright
          /tmp/domvenv/bin/python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/patrol-v115/tests/test_dom.py')
          s=p.read_text().replace("shutil.which('chromium') or None", "shutil.which('chromium') or shutil.which('google-chrome') or None")
          anchor="        browser.close()"
          extra='''        r = read('<h1>Issue Monitor</h1><div class="k-loading-mask" style="display:none">Loading</div><table>'+HEADERS+ROW+'</table>')
                  check(not r['loading'] and r['totalRows']==1, 'hidden loader cannot freeze polling')
                  r = read('<h1>Issue Monitor</h1><div style="display:none"><div class="k-loading-mask">Loading</div></div><table>'+HEADERS+ROW+'</table>')
                  check(not r['loading'], 'hidden ancestor loader ignored')
                  r = read('<h1>Issue Monitor</h1><table>'+HEADERS+'</table>')
                  check(r['totalRows']==0 and not r['emptyConfirmed'], 'loading shell is not an explicit empty feed')
                  r = read('<h1>Issue Monitor</h1><p>No records to display</p><table>'+HEADERS+'</table>')
                  check(r['emptyConfirmed'], 'explicit empty feed distinguished from loading shell')
          '''
          extra='\n'.join(line[10:] if line.startswith('                  ') else line for line in extra.split('\n'))
          s=s.replace(anchor,extra+'\n'+anchor)
          p.write_text(s)
          PY
          /tmp/domvenv/bin/python /tmp/patrol-v115/tests/test_dom.py | tee /tmp/deliver115/DOM-TESTS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 automatic-refresh regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: cd /tmp/patrol-v115 && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Verify release signature and package
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/patrol-v115/app/build/outputs/apk/release/app-release.apk /tmp/deliver115/Ronin-Patrol-Link-v1.1.5-refresh-lifecycle.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs /tmp/deliver115/Ronin-Patrol-Link-v1.1.5-refresh-lifecycle.apk | tee /tmp/deliver115/APK-VERIFICATION.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/deliver115/APK-VERIFICATION.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging /tmp/deliver115/Ronin-Patrol-Link-v1.1.5-refresh-lifecycle.apk > /tmp/deliver115/PACKAGE.txt
          sha256sum /tmp/deliver115/*.apk > /tmp/deliver115/SHA256SUMS.txt
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Ronin-Patrol-Link-v1.1.5-verified
          path: /tmp/deliver115/*
          retention-days: 7
      - name: Upload test reports and source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patrol-Link-v115-test-evidence
          path: |
            /tmp/patrol-v115/app/build/reports/
            /tmp/patrol-v115/app/build/outputs/androidTest-results/
            /tmp/patrol-v115/app/build/test-results/
            /tmp/patrol-v115/app/src/main/
            /tmp/patrol-v115/app/src/test/
            /tmp/patrol-v115/app/src/androidTest/
            /tmp/patrol-v115/app/build.gradle
          retention-days: 7
