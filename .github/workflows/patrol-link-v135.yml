name: Patrol Link 1.1.25 editable master script
on:
  push:
    branches: ['patrol-link-v135-estate-master-script']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: patrol-link-v135-estate-master-script
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reconstruct the verified base and apply script-import patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBUILD'
          from pathlib import Path
          import subprocess
          # Reuse the exact base reconstruction recipe, without changing prior patches.
          lines=Path('.github/workflows/patrol-link-v134.yml').read_text().splitlines()
          marker=next(i for i,s in enumerate(lines) if s.strip()=='- name: Reconstruct Patrol Link and apply complete-library voice update')
          start=next(i for i in range(marker,len(lines)) if lines[i].strip()=='run: |')+1
          end=next(i for i in range(start,len(lines)) if lines[i].startswith('      - name:'))
          script='\n'.join(s[10:] if s.startswith('          ') else s for s in lines[start:end])
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          subprocess.run(['python3','.patrolbuild/v135/patch.py','/tmp/patrol-v134'],check=True)
          root=Path('/tmp/patrol-v134')
          assert "versionName '1.1.25'" in (root/'app/build.gradle').read_text()
          j=root/'app/src/main/java/au/com/roningroup/patrollink'
          assert 'addition?250:2000' in (j/'ExactPhrasePack.java').read_text()
          assert 'Load script text file (.txt)' in (j/'MainActivity.java').read_text()
          PYBUILD
      - name: Compile release and run unit tests
        working-directory: /tmp/patrol-v134
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Browser parser regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/deliver135/evidence
          python3 -m venv /tmp/domvenv135
          /tmp/domvenv135/bin/pip -q install playwright
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/patrol-v134/tests/test_dom.py')
          p.write_text(p.read_text().replace("shutil.which('chromium') or None","shutil.which('chromium') or shutil.which('google-chrome') or None"))
          PY
          /tmp/domvenv135/bin/python /tmp/patrol-v134/tests/test_dom.py | tee /tmp/deliver135/evidence/DOM-TESTS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 regression and 608-phrase import tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: cd /tmp/patrol-v134 && gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=au.com.roningroup.patrollink.RefreshLifecycleTest,au.com.roningroup.patrollink.TlsRecoveryTest,au.com.roningroup.patrollink.ExactPhrasePackTest,au.com.roningroup.patrollink.SiteVoiceCoverageTest,au.com.roningroup.patrollink.SingleWavCanonicalTest,au.com.roningroup.patrollink.AdaptiveRefreshTest,au.com.roningroup.patrollink.SpeechPreviewParityTest,au.com.roningroup.patrollink.DynamicCheckpointKeyTest,au.com.roningroup.patrollink.AdditivePhrasePackTest,au.com.roningroup.patrollink.CompleteLibraryTemplateTest,au.com.roningroup.patrollink.EditableMasterScriptTest
      - name: Verify signature and collect actual test results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/deliver135/evidence
          APK=/tmp/deliver135/Ronin-Patrol-Link-v1.1.25-Master-Script-Import.apk
          cp /tmp/patrol-v134/app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > /tmp/deliver135/evidence/APK-SIGNATURE.txt
          grep -q 'Signer #1 certificate SHA-256 digest: ff91d55288f1a7160e13c1affcdfef9bba89d24b2a74b0e4d7f7e923569e9332' /tmp/deliver135/evidence/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/deliver135/evidence/PACKAGE.txt
          sha256sum "$APK" > /tmp/deliver135/evidence/SHA256SUMS.txt
          python3 - <<'PY'
          from pathlib import Path
          import os, xml.etree.ElementTree as E
          folders=[Path('/tmp/patrol-v134/app/build/test-results'),Path('/tmp/patrol-v134/app/build/outputs/androidTest-results')]
          tests=0; names=[]
          for folder in folders:
              for f in folder.rglob('TEST-*.xml'):
                  for suite in E.parse(f).getroot().iter('testsuite'):
                      assert not any(int(suite.attrib.get(k,'0')) for k in ('failures','errors','skipped')),(str(f),suite.attrib)
                      tests+=int(suite.attrib.get('tests','0'))
                      names.append(suite.attrib.get('name',''))
          assert any('EditableMasterScriptTest' in n for n in names),names
          text='\n'.join([
              'RONIN PATROL LINK 1.1.25 - MASTER SCRIPT IMPORT',
              'Commit: '+os.environ['GITHUB_SHA'],
              'CI run: '+os.environ['GITHUB_RUN_ID'],
              'JUnit and Android instrumentation tests passed: '+str(tests),
              'Chromium DOM/parser checks passed separately.',
              '',
              'Load script text file (.txt) accepts a plain one-phrase-per-line list or a script containing [pause 3] separators.',
              'The phrase order is stored as the full-WAV import template. Creating a new voice no longer overwrites a template just loaded or copied.',
              'Copy loaded script / template copies the loaded manifest, not the currently installed audio library.',
              'Full-library imports now accept 1-2000 phrases. Add-on files remain limited to 250 phrases each; repeated add-ons remain supported.',
              'A 608-phrase synthetic WAV was successfully imported in the Android 16 tests.',
              'Invalid phrase counts and duplicate script lines are rejected. Loading text alone does not replace audio.',
              'Unambiguous legacy truncated titles can match their completed spellings when the old exact clip is absent.',
              'Existing checkpoint counting, browser rendering, refresh scheduling, and stored voice audio are not migrated or reset by this update.',
              'Pet words are optional recorded vocabulary only; this update does not enable pet names in announcements.',
              '',
              'Install over the existing Patrol Link app. Do not uninstall or clear data.',
              'Test boundary: synthetic recordings and emulator fixtures only; no authenticated live Silvertracker session or physical handset was tested.',
              'No new speech recording was generated in this build.'
          ])+'\n'
          Path('/tmp/deliver135/Ronin-Patrol-Link-v1.1.25-VERIFICATION.txt').write_text(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Ronin-Patrol-Link-v1.1.25-verified
          path: |
            /tmp/deliver135/Ronin-Patrol-Link-v1.1.25-Master-Script-Import.apk
            /tmp/deliver135/Ronin-Patrol-Link-v1.1.25-VERIFICATION.txt
            /tmp/deliver135/evidence/
          retention-days: 7
      - name: Evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patrol-Link-v135-test-evidence
          path: |
            /tmp/patrol-v134/app/build/test-results/
            /tmp/patrol-v134/app/build/outputs/androidTest-results/
            /tmp/patrol-v134/app/build/reports/
            /tmp/patrol-v134/app/src/main/java/au/com/roningroup/patrollink/VoiceScriptText.java
            /tmp/patrol-v134/app/src/main/java/au/com/roningroup/patrollink/VoiceManager.java
            /tmp/patrol-v134/app/src/main/java/au/com/roningroup/patrollink/ExactPhrasePack.java
            /tmp/patrol-v134/app/src/main/java/au/com/roningroup/patrollink/MainActivity.java
          retention-days: 7
