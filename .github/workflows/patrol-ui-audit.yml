name: Inspect released Patrol Link UI and reader source
on:
  push:
    branches: [trl-tablet-v1.1.53]
    paths: ['.github/workflows/patrol-ui-audit.yml']
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TRL-Patrol-Link-v1.1.56-APK-AND-REPORTS
          run-id: 38449443813
          github-token: ${{ github.token }}
          path: qa/
      - name: Materialize only the already released engine, reader and manifest source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          paths=['app/src/main/java/au/com/roningroup/patrollink/'+name+'.java' for name in ['PatrolEngine','PatrolApp','VoiceManager','ExactPhrasePack','FeatherlessVoice','SilvertrackerLoginStore','MonitorService','LocalGpsService','AppUpdateManager']]
          out=Path('.source-audit/v156-startup');out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile('qa/TRL-Patrol-Link-v1.1.56-FULL-SOURCE.zip') as z:
              for suffix in paths:
                  matches=[p for p in z.namelist() if p.endswith('/'+suffix)]
                  assert len(matches)==1
                  (out/Path(suffix).name).write_bytes(z.read(matches[0]))
          PY
          git config user.name "Ronin source audit"
          git config user.email "actions@users.noreply.github.com"
          git add .source-audit/v156-startup
          git commit -m "Inspect the existing released Patrol Link engine and DOM reader"
          git push origin HEAD:trl-tablet-v1.1.53
