name: Build TRL Mother Base Windows
on:
  push:
    branches: [trl-mother-base-v1]
    paths: ['mother-base/*.cs', 'mother-base/*.csproj', 'mother-base/setup.iss', '.github/workflows/mother-base-windows.yml']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Build self-contained Windows application
        run: dotnet publish mother-base/TRL.MotherBase.csproj -c Release -r win-x64 --self-contained true -o mother-base/publish
      - name: Smoke test desktop startup
        shell: pwsh
        run: |
          $process = Start-Process mother-base/publish/TRL-Mother-Base.exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Desktop startup failed" }
      - name: Package installable Windows setup
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          & $compiler mother-base/setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          Get-FileHash mother-base/installer/*.exe -Algorithm SHA256 | Format-List | Out-File mother-base/installer/SHA256.txt
      - name: Verify unattended install and installed startup
        shell: pwsh
        run: |
          $installer = Get-ChildItem mother-base/installer/*.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP "trl-mother-base-installed"
          $process = Start-Process $installer.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed" }
          $process = Start-Process "$target/TRL-Mother-Base.exe" -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installed startup failed" }
      - name: Verify readable UI and capture actual Windows screens
        shell: pwsh
        run: |
          python mother-base/capture-screenshots.py
          dotnet publish mother-base/TRL.MotherBase.csproj -c Release -r win-x64 --self-contained true -o mother-base/capture-publish
          if ($LASTEXITCODE -ne 0) { throw "Screenshot harness build failed" }
          $process = Start-Process mother-base/capture-publish/TRL-Mother-Base.exe -ArgumentList '--screenshots' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "UI navigation/search/render checks failed" }
          if ((Get-ChildItem mother-base/screenshots-v03/*.png).Count -ne 7) { throw "Screenshots missing" }
          git restore mother-base/Program.cs
      - uses: actions/upload-artifact@v4
        with:
          name: TRL-Mother-Base-Windows-Setup
          path: mother-base/installer/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: TRL-Mother-Base-Screenshots-0.3
          path: mother-base/screenshots-v03/*.png
          retention-days: 30
      - name: Publish Windows desktop refresh
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @((Get-ChildItem mother-base/installer/*).FullName) + @((Get-ChildItem mother-base/screenshots-v03/*.png).FullName) + @("mother-base/DESKTOP-0.3.md")
          git tag trl-mother-base-preview-0.3.0 $env:GITHUB_SHA
          git push origin refs/tags/trl-mother-base-preview-0.3.0
          if ($LASTEXITCODE -ne 0) { throw "Release tag publication failed; verified installer is available as an artifact" }
          gh release create trl-mother-base-preview-0.3.0 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "TRL Mother Base 0.3.0 — desktop refresh" --notes-file mother-base/DESKTOP-0.3.md @assets
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
      - name: Save interface previews for review
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mother-base/screenshots-v03/*.png
          git commit -m "Add dark Mother Base desktop screenshots with sample data [skip ci]"
          git push origin HEAD:trl-mother-base-v1
          if ($LASTEXITCODE -ne 0) { throw "Screenshot publication failed" }
      - name: Emit sample screenshots for visual review
        shell: pwsh
        run: |
          foreach ($name in @("01-overview","02-vehicles")) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path "mother-base/screenshots-v03/$name.png"))
            Write-Output ("TRL_SCREENSHOT_" + $name + "=" + [Convert]::ToBase64String($bytes))
          }
