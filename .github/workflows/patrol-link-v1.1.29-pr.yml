name: Patrol Link v1.1.29 PR Build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Patrol Link source
        shell: bash
        run: |
          mkdir -p /tmp/patrol-src
          cat .patrol-link-build/part_*.txt | base64 -d > /tmp/patrol.tar.gz
          tar -xzf /tmp/patrol.tar.gz -C /tmp/patrol-src
          mkdir -p /tmp/patrol-src/PROJECT/app/src/main/assets/bundled_voice
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Ensure Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build release APK
        working-directory: /tmp/patrol-src/PROJECT
        shell: bash
        run: gradle --no-daemon :app:assembleRelease
      - name: Collect output and signing tools
        shell: bash
        run: |
          mkdir -p /tmp/patrol-out/tools/lib
          cp /tmp/patrol-src/PROJECT/app/build/outputs/apk/release/*.apk /tmp/patrol-out/PatrolLink-v1.1.29-no-tiff.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" /tmp/patrol-out/tools/lib/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" /tmp/patrol-out/tools/zipalign
          chmod +x /tmp/patrol-out/tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: PatrolLink-v1.1.29-build
          path: /tmp/patrol-out/
          if-no-files-found: error
