name: Patrol Link 1.1.23 additive voice library
on:
  push:
    branches: ['patrol-link-v133-additive-voice-library']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: patrol-link-v133-additive-voice-library
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct Patrol Link and apply additive voice-library update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/patrol-v133 /tmp/deliver133/evidence
          cat .patrolbuild/base.part0{0,1,2,3,4,5} | base64 -d > /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/patrol-v133
          cat .patrolbuild/overlay.part0{0,1,2} | base64 -d > /tmp/overlay.tgz
          tar -xzf /tmp/overlay.tgz -C /tmp/patrol-v133
          J=/tmp/patrol-v133/app/src/main/java/au/com/roningroup/patrollink

          cp .patrolbuild/PatrolEngine.java .patrolbuild/MainActivity.java "$J/"
          python3 .patrolbuild/v115-patch.py /tmp/patrol-v133
          mkdir -p /tmp/patrol-v133/app/src/androidTest/java/au/com/roningroup/patrollink
          cp .patrolbuild/RefreshLifecycleTest.java /tmp/patrol-v133/app/src/androidTest/java/au/com/roningroup/patrollink/
          python3 .patrolbuild/v115-finalize.py /tmp/patrol-v133
          python3 .patrolbuild/v116-patch.py /tmp/patrol-v133
          cp .patrolbuild/TlsPolicy.java "$J/"
          cp .patrolbuild/TlsPolicyTest.java /tmp/patrol-v133/app/src/test/java/au/com/roningroup/patrollink/
          cp .patrolbuild/TlsRecoveryTest.java /tmp/patrol-v133/app/src/androidTest/java/au/com/roningroup/patrollink/
          python3 .patrolbuild/v117-patch.py /tmp/patrol-v133
          python3 .patrolbuild/v121/patch.py /tmp/patrol-v133
          python3 .patrolbuild/v122/patch.py /tmp/patrol-v133
          python3 .patrolbuild/v123/patch.py /tmp/patrol-v133
          python3 .patrolbuild/v124/patch.py /tmp/patrol-v133
          python3 .patrolbuild/v125/patch.py /tmp/patrol-v133
          python3 .patrolbuild/v126/patch.py /tmp/patrol-v133
          python3 .patrolbuild/v127/patch.py /tmp/patrol-v133
          python3 .patrolbuild/v128/patch.py /tmp/patrol-v133
          python3 .patrolbuild/v129/patch.py /tmp/patrol-v133
          mkdir -p /tmp/patrol-v133/app/src/main/assets/exact
          cp .patrolbuild/v123/base_phrases.txt /tmp/patrol-v133/app/src/main/assets/exact/base_phrases.txt
          python3 .patrolbuild/v130/patch.py /tmp/patrol-v133
          python3 .patrolbuild/v131/patch.py /tmp/patrol-v133
          python3 .patrolbuild/v132/patch.py /tmp/patrol-v133
          python3 .patrolbuild/v133/patch.py /tmp/patrol-v133

          mkdir -p /tmp/patrol-v133/app/src/androidTest/assets
          keytool -J-Dkeystore.pkcs12.legacy -genkeypair -alias fixture -keyalg RSA -keysize 2048 -storetype PKCS12 \
            -keystore /tmp/patrol-v133/app/src/androidTest/assets/tls-fixture.p12 \
            -storepass fixture-only -keypass fixture-only \
            -dname 'CN=localhost,OU=Instrumentation fixture only,O=Test' \
            -ext SAN=dns:localhost,ip:127.0.0.1 -ext EKU=serverAuth -validity 30 -noprompt

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/patrol-v133')
          java=root/'app/src/main/java/au/com/roningroup/patrollink'
          assert "versionName '1.1.23'" in (root/'app/build.gradle').read_text()
          tracker=(java/'CheckpointTracker.java').read_text()
          main=(java/'MainActivity.java').read_text()
          assert 'guard+"|"+area.key+"|"+o.recordedAt' in tracker
          assert 'Issue ID is deliberately NOT part' in tracker
          assert 'migratedEvents' in tracker
          assert 'Rec Center 2 Gym' in tracker
          assert 'Rec Center 2 Barbecue Area' in tracker
          assert 'Unique hit = area + Silvertracker recorded time + guard.' in main
          assert 'LAST PAGE ADDED' in main
          assert 'CheckpointTracker.POINTS' not in main
          voice=(java/'VoiceManager.java').read_text()
          exact=(java/'ExactPhrasePack.java').read_text()
          assert 'importAdditions' in exact
          assert 'ExactPhraseResolver.resolve' in voice
          assert 'Add / replace exact phrases' in main
          assert 'REQ_VOICE_ADDON = 4103' in main
          PY

      - name: Compile and unit tests
        working-directory: /tmp/patrol-v133
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Browser parser regressions
        shell: bash
        run: |
          python3 -m venv /tmp/domvenv
          /tmp/domvenv/bin/pip -q install playwright
          /tmp/domvenv/bin/python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/patrol-v133/tests/test_dom.py')
          p.write_text(p.read_text().replace("shutil.which('chromium') or None","shutil.which('chromium') or shutil.which('google-chrome') or None"))
          PY
          /tmp/domvenv/bin/python /tmp/patrol-v133/tests/test_dom.py | tee /tmp/deliver133/evidence/DOM-TESTS.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 checkpoint regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: cd /tmp/patrol-v133 && gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=au.com.roningroup.patrollink.RefreshLifecycleTest,au.com.roningroup.patrollink.TlsRecoveryTest,au.com.roningroup.patrollink.ExactPhrasePackTest,au.com.roningroup.patrollink.SiteVoiceCoverageTest,au.com.roningroup.patrollink.SingleWavCanonicalTest,au.com.roningroup.patrollink.AdaptiveRefreshTest,au.com.roningroup.patrollink.SpeechPreviewParityTest,au.com.roningroup.patrollink.DynamicCheckpointKeyTest,au.com.roningroup.patrollink.AdditivePhrasePackTest

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/deliver133/Ronin-Patrol-Link-v1.1.23-Expandable-Voice-Library.apk
          cp /tmp/patrol-v133/app/build/outputs/apk/release/app-release.apk "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > /tmp/deliver133/evidence/APK-SIGNATURE.txt
          grep -q 'Signer #1 certificate SHA-256 digest: ff91d55288f1a7160e13c1affcdfef9bba89d24b2a74b0e4d7f7e923569e9332' /tmp/deliver133/evidence/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/deliver133/evidence/PACKAGE.txt
          sha256sum "$APK" > /tmp/deliver133/evidence/SHA256SUMS.txt

          cat > /tmp/deliver133/Ronin-Patrol-Link-v1.1.23-VERIFICATION.txt <<'EOF'
          RONIN PATROL LINK 1.1.23 — EXPANDABLE EXACT VOICE LIBRARY

          VOICE LIBRARY
          The existing exact Evelyn recordings remain the base library.
          Additional WAVs can be imported indefinitely; there are no numbered Part 1 / Part 2 / Part 3 packs.
          Each add-on contains only the new or corrected phrases the user chooses, one phrase per line with [pause 3] separators.
          A one-phrase add-on is valid.
          New phrases are appended. If an exact phrase already exists, only that phrase recording is replaced.
          Other installed recordings are preserved.

          COMPOSABLE EXACT PLAYBACK
          Full exact sentence recordings are preferred when present.
          If a full sentence is absent, Patrol Link can compose it from smaller exact recordings using the fewest matching clips.
          Example: an existing "General Patrol" recording plus a newly imported "Bobsled Lane" recording can play "General Patrol - Bobsled Lane".
          Missing words are never synthesised and no fallback voice is used.

          UI
          Voice library now has Add / replace exact phrases.
          The phrase draft persists through the file picker.
          Copy add-on script produces only the lines entered by the user.
          Import add-on WAV merges those recordings into the selected voice library.
          The old full base-script/base-WAV controls remain available only for a new voice or intentional complete rebuild.

          CHECKPOINTS
          The v1.1.22 dynamic guard + area + Silvertracker timestamp checkpoint logic is retained unchanged.

          INSTALL
          Install over v1.1.22. Do not uninstall or clear app data; the existing exact voice library is retained.

          TEST SCOPE
          Compilation, unit tests, Chromium parser regressions, Android 16 existing regressions, additive phrase import, phrase replacement, single-phrase add-ons and composable exact playback are covered.
          CI does not use the user's physical phone or authenticated live Silvertracker account.
          EOF
      - name: Publish direct APK on build branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp /tmp/deliver133/Ronin-Patrol-Link-v1.1.23-Expandable-Voice-Library.apk dist/Ronin-Patrol-Link-v1.1.23-Expandable-Voice-Library.apk
          git config user.name "Ronin Patrol Link Builder"
          git config user.email "actions@users.noreply.github.com"
          git add dist/Ronin-Patrol-Link-v1.1.23-Expandable-Voice-Library.apk
          if git diff --cached --quiet; then
            echo "Direct APK already current."
          else
            git commit -m "Publish Patrol Link v1.1.23 direct APK [skip ci]"
            git push origin HEAD:patrol-link-v133-additive-voice-library
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Ronin-Patrol-Link-v1.1.23-verified
          path: |
            /tmp/deliver133/Ronin-Patrol-Link-v1.1.23-Expandable-Voice-Library.apk
            /tmp/deliver133/Ronin-Patrol-Link-v1.1.23-VERIFICATION.txt
          retention-days: 7

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patrol-Link-v133-evidence
          path: |
            /tmp/patrol-v133/app/build/reports/
            /tmp/patrol-v133/app/build/test-results/
            /tmp/patrol-v133/app/build/outputs/androidTest-results/
            /tmp/deliver133/evidence/
          retention-days: 7
