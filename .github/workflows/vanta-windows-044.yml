name: Ronin Vanta Windows 0.4.4 - Agentic Forge
on:
  push:
    branches: ['fix/vanta-windows-044-agentic-forge']
    paths: ['vanta/windows-044/**', '.github/workflows/vanta-windows-044.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vanta-windows-044-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - name: Reconstruct exact Windows 0.4.3 source and apply Agentic Forge
        shell: pwsh
        run: |
          $scripts=@(
            'vanta/windows-native/materialize.py',
            'vanta/windows-native/review.py',
            'vanta/windows-native/apply_tests.py',
            'vanta/windows-native/quality_review.py',
            'vanta/windows-native/test_review.py',
            'vanta/windows-native/finish.py',
            'vanta/windows-native/last_review.py',
            'vanta/windows-030/materialize.py',
            'vanta/windows-030/compiler_repair.py',
            'vanta/windows-040/apply.py',
            'vanta/windows-041/apply.py',
            'vanta/windows-041/finalize.py',
            'vanta/windows-041/stabilize.py',
            'vanta/windows-042/apply.py',
            'vanta/windows-043/apply.py',
            'vanta/windows-043/finalize.py',
            'vanta/windows-044/apply.py'
          )
          foreach($script in $scripts){
            if(Test-Path $script){
              python $script
              if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
            }
          }
      - name: Compile native Windows client and test harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet build ronin-vanta-windows/src/Vanta.Windows/Vanta.Windows.csproj -c Release --nologo 2>&1 | Tee-Object artifacts/build.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          dotnet build ronin-vanta-windows/tests/Vanta.Tests/Vanta.Tests.csproj -c Release --nologo 2>&1 | Tee-Object artifacts/test-build.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Execute native regression and UI acceptance suite
        shell: pwsh
        run: |
          dotnet run --project ronin-vanta-windows/tests/Vanta.Tests/Vanta.Tests.csproj -c Release --no-build -- artifacts/qa 2>&1 | Tee-Object artifacts/test-run.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Publish self-contained Windows x64 runtime
        shell: pwsh
        run: |
          dotnet publish ronin-vanta-windows/src/Vanta.Windows/Vanta.Windows.csproj -c Release -r win-x64 --self-contained true -o artifacts/app --nologo 2>&1 | Tee-Object artifacts/publish.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          if(!(Test-Path artifacts/app/RoninVanta.exe)){throw 'Published executable missing'}
      - name: Build installer and execute installer smoke tests
        shell: pwsh
        run: |
          & vanta/windows-044/package.ps1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Preserve source and checksums
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -c "from pathlib import Path;import zipfile;root=Path('ronin-vanta-windows');z=zipfile.ZipFile('artifacts/Ronin-Vanta-Windows-0.4.4-Source.zip','w',zipfile.ZIP_DEFLATED);[(z.write(p,'ronin-vanta-windows/'+str(p.relative_to(root)))) for p in root.rglob('*') if p.is_file() and not {'bin','obj'}.intersection(p.parts)];z.close()"
          git rev-parse HEAD | Out-File artifacts/compiled-commit.txt
          if(Test-Path artifacts/installer/Ronin-Vanta-Windows-0.4.4-Setup.exe){
            Get-FileHash artifacts/installer/Ronin-Vanta-Windows-0.4.4-Setup.exe -Algorithm SHA256 | Format-List | Out-File artifacts/installer-sha256.txt
          }
          if(Test-Path artifacts/qa/private-test-profiles){Remove-Item artifacts/qa/private-test-profiles -Recurse -Force}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-vanta-windows-0.4.4
          path: |
            artifacts/*.log
            artifacts/*.zip
            artifacts/*.txt
            artifacts/qa/
            artifacts/installer/
          if-no-files-found: error
