name: Vanta Prime v1 - elite build and Android 16 QA

on:
  pull_request:
    paths:
      - 'vanta/prime9_*.txt'
      - 'vanta/apply_prime.py'
      - '.github/workflows/vanta-prime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vanta-prime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify and materialize exact Prime source
        run: python3 vanta/apply_prime.py

      - name: Add QA-only Android instrumentation harness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vanta/app/build.gradle')
          s=p.read_text()
          s=s.replace("versionName '1.0.0-prime'", "versionName '1.0.0-prime'\n        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'")
          s += "\n\ndependencies {\n    androidTestImplementation 'androidx.test:core:1.7.0'\n    androidTestImplementation 'androidx.test:runner:1.7.0'\n    androidTestImplementation 'androidx.test:rules:1.7.0'\n    androidTestImplementation 'androidx.test.ext:junit:1.3.0'\n}\n"
          p.write_text(s)
          PY
          mkdir -p vanta/app/src/androidTest/java/com/ronin/vanta
          cat > vanta/app/src/androidTest/java/com/ronin/vanta/DeviceTest.java <<'EOF'
          package com.ronin.vanta;

          import static org.junit.Assert.assertNotNull;
          import androidx.test.core.app.ActivityScenario;
          import androidx.test.ext.junit.runners.AndroidJUnit4;
          import org.junit.Test;
          import org.junit.runner.RunWith;
          import java.lang.reflect.Method;

          @RunWith(AndroidJUnit4.class)
          public class DeviceTest {
              @Test public void allWorkspacesOpenWithoutCredentials() throws Exception {
                  try (ActivityScenario<MainActivity> scenario = ActivityScenario.launch(MainActivity.class)) {
                      scenario.onActivity(activity -> {
                          try {
                              Method show = MainActivity.class.getDeclaredMethod("showMode", String.class);
                              show.setAccessible(true);
                              String[] modes = {"home","chat","code","image","video","voice","converse","forge","setup"};
                              for (String mode : modes) {
                                  show.invoke(activity, mode);
                                  assertNotNull(activity.findViewById(android.R.id.content));
                              }
                          } catch (Exception e) { throw new RuntimeException(e); }
                      });
                  }
              }
          }
          EOF

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Compile, unit tests, lint, debug and release
        run: gradle -p vanta --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest --stacktrace

      - name: Android 16 emulator workspace smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb install -r vanta/app/build/outputs/apk/debug/app-debug.apk
            adb install -r vanta/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class 'com.ronin.vanta.DeviceTest#allWorkspacesOpenWithoutCredentials' com.ronin.vanta.test/androidx.test.runner.AndroidJUnitRunner | tee prime-instrumentation.txt
            grep -Fq 'OK (1 test)' prime-instrumentation.txt

      - name: Stage verified distribution
        if: always()
        run: |
          mkdir -p prime-distribution prime-qa
          test -f vanta/app/build/outputs/apk/debug/app-debug.apk && cp vanta/app/build/outputs/apk/debug/app-debug.apk prime-distribution/Ronin-Vanta-Prime-v1.0-debug.apk || true
          test -f vanta/app/build/outputs/apk/release/app-release-unsigned.apk && cp vanta/app/build/outputs/apk/release/app-release-unsigned.apk prime-distribution/Ronin-Vanta-Prime-v1.0-release-unsigned.apk || true
          cd vanta && zip -qr ../prime-distribution/Ronin-Vanta-Prime-v1.0-Source.zip app/src/main app/build.gradle build.gradle settings.gradle gradle.properties
          cd ..
          cp prime-instrumentation.txt prime-qa/ 2>/dev/null || true
          cp -r vanta/app/build/reports prime-qa/ 2>/dev/null || true
          cp -r vanta/app/build/test-results prime-qa/ 2>/dev/null || true
          sha256sum prime-distribution/* > prime-distribution/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-vanta-prime-v1-distribution
          path: prime-distribution/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-vanta-prime-v1-QA
          path: prime-qa/
          if-no-files-found: warn
