name: Mother Base source and build verification
on:
  push:
    branches: [trl-mother-base-v1]
    paths: ['.github/workflows/mother-base-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Reconstruct and inspect interfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re
          lines=Path('.github/workflows/patrol-link-v158.yml').read_text().splitlines()
          marker=next(i for i,s in enumerate(lines) if s.strip()=='- name: Reconstruct current Patrol Link source')
          start=next(i for i in range(marker,len(lines)) if lines[i].strip()=='run: |')+1
          end=next(i for i in range(start,len(lines)) if lines[i].startswith('      - name:'))
          script='\n'.join(s[10:] if s.startswith('          ') else s for s in lines[start:end])
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          j=Path('/tmp/patrol-v134/app/src/main/java/au/com/roningroup/patrollink')
          for name in ['PatrolEngine.java','CheckpointSyncClient.java','CheckpointProximityUi.java']:
              lines=(j/name).read_text().splitlines()
              print('INTERFACES '+name)
              for i,line in enumerate(lines):
                  if re.search(r'(JSONObject|JSONArray|class |parse|detail|evaluateJavascript|publish\(|syncTick|applyRemote|KEY=)',line) and not re.search(r'(password|cookie|credential|secret|token|API_KEY)',line,re.I):
                      print(str(i+1)+': '+line[:500])
          PY
      - name: Baseline Android regression and signed build
        working-directory: /tmp/patrol-v134
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Mother-Base-baseline-Android-reports
          path: /tmp/patrol-v134/app/build/reports/tests/
          retention-days: 7
