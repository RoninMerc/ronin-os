name: Build Ronin Voice Reader Direct APK

on:
  push:
    branches:
      - voice-reader-direct-20260928
    paths:
      - 'voice-reader-direct/**'
      - '.github/workflows/build-ronin-voice-reader-direct.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch official sherpa-onnx Android runtime
        run: |
          mkdir -p voice-reader-direct/app/libs
          curl -fL --retry 3             https://raw.githubusercontent.com/HayaiApp/HayaiTTS/main/app/libs/sherpa-onnx-1.13.2.aar             -o voice-reader-direct/app/libs/sherpa-onnx-1.13.2.aar
          test $(stat -c%s voice-reader-direct/app/libs/sherpa-onnx-1.13.2.aar) -gt 50000000

      - name: Gradle 8.9
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build APK
        working-directory: voice-reader-direct
        run: |
          /tmp/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          APK="$(find voice-reader-direct/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/Ronin-Voice-Reader-Direct-0.2.0.apk
          ls -lh dist/Ronin-Voice-Reader-Direct-0.2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ronin-Voice-Reader-Direct-0.2.0
          path: dist/Ronin-Voice-Reader-Direct-0.2.0.apk
          if-no-files-found: error
          retention-days: 7
