name: Official Android test image
on:
  push:
    branches: [trl-breach-fleet-build-tools]
    paths: ['.github/workflows/trl-atd-downloads.yml']
permissions:
  contents: read
jobs:
  downloads:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Download checksum-verified official API35 AOSP image
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const {Readable}=require('stream');
            const {pipeline}=require('stream/promises');
            fs.mkdirSync('downloads',{recursive:true});
            const repo='https://dl.google.com/android/repository/sys-img/android/sys-img2-3.xml';
            const response=await fetch(repo);if(!response.ok)throw Error('Official repository metadata unavailable '+response.status);
            const xml=await response.text();
            const blocks=xml.match(/<remotePackage\b[\s\S]*?<\/remotePackage>/g)||[];
            const id='system-images;android-35;default;x86_64';
            const candidates=blocks.filter(x=>x.includes('path="'+id+'"'));
            const pkg=candidates.find(x=>x.includes('channel-0'))||candidates[0];
            if(!pkg){
              fs.writeFileSync('downloads/official-package-metadata.xml',xml);
              core.info('Available API35 packages: '+blocks.filter(x=>x.includes('android-35')).map(x=>(x.match(/path="([^"]+)"/)||[])[1]).join(', '));
              throw Error('Official package missing: '+id);
            }
            const archives=pkg.match(/<archive>[\s\S]*?<\/archive>/g)||[];
            const archive=archives.find(x=>x.includes('<host-os>linux</host-os>'))||archives.find(x=>!x.includes('<host-os>'));
            if(!archive)throw Error('Linux archive missing');
            const url=new URL(archive.match(/<url>([^<]+)<\/url>/)[1],repo).href;
            if(!url.startsWith('https://dl.google.com/'))throw Error('Non-official archive host');
            const expected=archive.match(/<checksum(?:\s[^>]*)?>([^<]+)<\/checksum>/)[1].trim().toLowerCase();
            const bytes=Number(archive.match(/<size>([^<]+)<\/size>/)[1]);
            const data=await fetch(url);if(!data.ok)throw Error('Official archive unavailable '+data.status);
            await pipeline(Readable.fromWeb(data.body),fs.createWriteStream('downloads/system-image.zip'));
            const hash=crypto.createHash(expected.length===64?'sha256':'sha1');
            for await(const chunk of fs.createReadStream('downloads/system-image.zip'))hash.update(chunk);
            if(hash.digest('hex')!==expected||fs.statSync('downloads/system-image.zip').size!==bytes)throw Error('Archive integrity mismatch');
            fs.writeFileSync('downloads/manifest.json',JSON.stringify({id,url,checksum:expected,bytes},null,2));
            core.info('Verified official package '+id+' ('+bytes+' bytes)');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trl-official-api35-system-image
          path: downloads/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
