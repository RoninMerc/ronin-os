name: Vanta Android 0.17.5 - Forge reliability
on:
  push:
    branches: ['fix/vanta-0175-forge-reliability']
    paths: ['vanta/v0175/**', '.github/workflows/vanta-0175.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: vanta-0175-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: vanta-0.17.1-build
          run-id: 37299338519
          github-token: ${{ github.token }}
          path: baseline
      - name: Apply exact source changes with per-file SHA verification
        run: |
          set -euo pipefail
          echo '6719c550d196b81295b208e5e61a94a5184c838b4d06c6b4fbedaeb485984c8c  baseline/Ronin-Vanta-0.17.1-Source.zip' | sha256sum -c -
          mkdir -p source distribution
          unzip -q baseline/Ronin-Vanta-0.17.1-Source.zip -d source
          python3 vanta/v0175/apply.py source
      - name: Compile both variants and execute retained plus new unit tests and lint
        run: |
          set -o pipefail
          gradle -p source --no-daemon --max-workers=2 --continue testDebugUnitTest testReleaseUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest --stacktrace 2>&1 | tee build.log
      - name: Exercise actual managed-gate output with real Gradle and failing-test rejection
        env:
          FORGE175_FIXTURE_OUT: ${{ github.workspace }}/fixture-evidence
        run: |
          set -euo pipefail
          gradle -p source -I "$GITHUB_WORKSPACE/vanta/v0175/fixture.gradle" --no-daemon --max-workers=2 :app:forge175Fixture --stacktrace 2>&1 | tee fixture-generation.log
          python3 vanta/v0175/check_fixture.py
          cp fixture-evidence/fixture-release-unsigned.apk source/app/src/androidTest/assets/fresh-compiler/generated-foundation-unsigned.apk
          gradle -p source --no-daemon --max-workers=2 assembleDebugAndroidTest --stacktrace
      - name: Stage unsigned owner payloads and separate QA upgrade pair
        run: |
          set -euo pipefail
          cp source/app/build/outputs/apk/release/app-release-unsigned.apk distribution/fixed-release-unsigned.apk
          cp source/app/build/outputs/apk/debug/app-debug.apk distribution/app-debug.apk
          cp source/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk distribution/tests.apk
          cp baseline/apksigner.jar distribution/
          gradle -p source --no-daemon --console=plain signingReport > /tmp/signing.txt
          KEY=$(sed -n 's/^Store: //p' /tmp/signing.txt | grep -v '^null$' | head -n1)
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" sign --ks "$KEY" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out distribution/release-qa.apk distribution/fixed-release-unsigned.apk
          "$SIGNER" sign --ks "$KEY" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out distribution/baseline-qa.apk baseline/fixed-release-unsigned.apk
          "$SIGNER" verify --verbose --print-certs distribution/release-qa.apk > distribution/qa-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging distribution/release-qa.apk > distribution/package.txt
          gradle -p source -PvantaApplicationId=com.ronin.vanta.personal --no-daemon --max-workers=2 assembleRelease --stacktrace 2>&1 | tee personal-build.log
          cp source/app/build/outputs/apk/release/app-release-unsigned.apk distribution/personal-release-unsigned.apk
          printf '%s\n' "$GITHUB_SHA" > distribution/source-commit.txt
          sha256sum distribution/*.apk > distribution/SHA256SUMS.txt
      - name: Preserve complete source and execution evidence
        if: always()
        run: |
          mkdir -p distribution
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('source')
          with zipfile.ZipFile('distribution/Ronin-Vanta-0.17.5-Source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in root.rglob('*'):
              if p.is_file() and not {'.gradle','build'}.intersection(p.relative_to(root).parts): z.write(p,p.relative_to(root))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: vanta-0.17.5-build, path: distribution/, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanta-0.17.5-reports
          path: |
            *build.log
            fixture-generation.log
            source/app/build/reports/
            source/app/build/test-results/
            fixture-evidence/*.log
            fixture-evidence/*.json
            fixture-evidence/*.xml
            fixture-evidence/source.zip
            fixture-evidence/fixture-release-unsigned.apk
          if-no-files-found: warn
  device:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 29, profile: pixel_6, label: phone}
          - {api: 36, profile: pixel_c, label: tablet}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: vanta-0.17.5-build, path: distribution}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: In-place upgrade and checkpoint/signing continuity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: '3072'
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          pre-emulator-launch-script: sed -i -e '/^vm.heapSize=/d' -e '/^hw.heapSize=/d' "${ANDROID_AVD_HOME}/test.avd/config.ini" && printf '\nvm.heapSize=256\n' >> "${ANDROID_AVD_HOME}/test.avd/config.ini"
          script: bash vanta/v0175/device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanta-0.17.5-${{ matrix.label }}-${{ matrix.api }}
          path: device-evidence/
          if-no-files-found: warn
