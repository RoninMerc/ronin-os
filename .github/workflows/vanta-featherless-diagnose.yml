name: Vanta Featherless live catalogue diagnosis
on:
  push:
    branches: ['fix/vanta-windows-042-featherless-contract']
    paths: ['.github/workflows/vanta-featherless-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Probe official public GET endpoints only
        shell: python
        run: |
          import urllib.request, urllib.error, json, time, pathlib, datetime, collections
          root=pathlib.Path('diagnosis');root.mkdir(exist_ok=True)
          probes=[('all_bulk','https://api.featherless.ai/v1/models?status=active,pending_deploy,not_deployed'),('inactive_bulk','https://api.featherless.ai/v1/models?status=pending_deploy,not_deployed')]
          records=[]
          for name,url in probes:
              start=time.monotonic()
              entry={'name':name,'url':url,'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'authenticated':False,'generation_requests':0}
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'RoninVantaWindows/0.4.2','Accept':'application/json','X-Title':'Ronin Vanta','HTTP-Referer':'https://github.com/RoninMerc/ronin-os'})
                  try: response=urllib.request.urlopen(request,timeout=45)
                  except urllib.error.HTTPError as error: response=error
                  with response:
                      body=response.read(33554433)
                      entry.update(status=response.status,bytes=len(body),headers={k:v for k,v in response.headers.items() if k.lower() in ['content-type','retry-after','x-ratelimit-limit','x-ratelimit-remaining','x-ratelimit-reset','ratelimit-limit','ratelimit-remaining','ratelimit-reset','cache-control','date','cf-ray','server']})
                  (root/(name+'.json')).write_bytes(body)
                  try:
                      data=json.loads(body)
                      entry.update(keys=list(data),metadata={k:v for k,v in data.items() if k!='data'},count=len(data.get('data',[])),sample=data.get('data',[])[:1],statuses=dict(collections.Counter(row.get('status','omitted') for row in data.get('data',[]))))
                  except Exception: entry['body_preview']=body[:1000].decode('utf-8',errors='replace')
              except Exception as error:entry['error']=str(error)
              entry['seconds']=round(time.monotonic()-start,3);records.append(entry);print(json.dumps(entry,indent=2),flush=True)
              if entry.get('status')==429:break
              time.sleep(5)
          (root/'results.json').write_text(json.dumps(records,indent=2),encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: featherless-public-api-diagnosis
          path: diagnosis/
          if-no-files-found: error
