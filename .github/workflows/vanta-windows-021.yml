name: Ronin Vanta Windows 0.2.1 - Vanta Orchestrator
on:
  push:
    branches: ['fix/vanta-windows-021-clean-orchestrator']
    paths:
      - 'vanta/windows-021/**'
      - '.github/workflows/vanta-windows-021.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vanta-windows-021-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - name: Reconstruct last fully verified Windows baseline
        shell: pwsh
        run: |
          python vanta/windows-native/materialize.py
          python vanta/windows-native/review.py
          python vanta/windows-native/apply_tests.py
          if(Test-Path vanta/windows-native/quality_review.py){python vanta/windows-native/quality_review.py}
          if(Test-Path vanta/windows-native/test_review.py){python vanta/windows-native/test_review.py}
          python vanta/windows-native/finish.py
          if(Test-Path vanta/windows-native/last_review.py){python vanta/windows-native/last_review.py}
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Apply checksum-verified 0.2.1 Vanta Orchestrator overlay
        shell: pwsh
        run: |
          python vanta/windows-021/apply.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          if(!(Test-Path ronin-vanta-windows/docs/VANTA_ORCHESTRATOR.md)){throw 'Orchestrator contract missing'}
          if(-not (Select-String -Quiet -Path ronin-vanta-windows/Directory.Build.props -Pattern '<Version>0.2.1</Version>')){throw 'Release version not applied'}
      - name: Compile native Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet build ronin-vanta-windows/src/Vanta.Windows/Vanta.Windows.csproj -c Release --nologo 2>&1 | Tee-Object artifacts/build.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Compile native test harness
        shell: pwsh
        run: |
          dotnet build ronin-vanta-windows/tests/Vanta.Tests/Vanta.Tests.csproj -c Release --nologo 2>&1 | Tee-Object artifacts/test-build.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Execute native workflow, routing, Forge, media, security and desktop tests
        shell: pwsh
        run: |
          dotnet run --project ronin-vanta-windows/tests/Vanta.Tests/Vanta.Tests.csproj -c Release --no-build -- artifacts/qa 2>&1 | Tee-Object artifacts/test-run.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Self-contained Windows x64 publication
        shell: pwsh
        run: |
          dotnet publish ronin-vanta-windows/src/Vanta.Windows/Vanta.Windows.csproj -c Release -r win-x64 --self-contained true -o artifacts/app --nologo 2>&1 | Tee-Object artifacts/publish.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          if(!(Test-Path artifacts/app/RoninVanta.exe)){throw 'Published executable missing'}
      - name: Build, install, launch, measure, reinstall and uninstall 0.2.1
        shell: pwsh
        run: |
          $source = Get-Content vanta/windows-native/package.ps1 -Raw
          $source = $source.Replace("vanta/windows-native/installer.iss", "ronin-vanta-windows/installer.iss")
          $source = $source.Replace("Ronin-Vanta-Windows-0.1.1-Setup.exe", "Ronin-Vanta-Windows-0.2.1-Setup.exe")
          $source = $source.Replace("version='0.1.1'", "version='0.2.1'")
          Set-Content artifacts/package-021.ps1 $source -Encoding utf8
          & artifacts/package-021.ps1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Preserve exact final source and release checksums
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -c "from pathlib import Path;import zipfile;root=Path('ronin-vanta-windows');z=zipfile.ZipFile('artifacts/Ronin-Vanta-Windows-0.2.1-Source.zip','w',zipfile.ZIP_DEFLATED);[(z.write(p,'ronin-vanta-windows/'+str(p.relative_to(root)))) for p in root.rglob('*') if p.is_file() and not {'bin','obj'}.intersection(p.parts)];z.close()"
          if(Test-Path artifacts/installer/Ronin-Vanta-Windows-0.2.1-Setup.exe){Get-FileHash artifacts/installer/Ronin-Vanta-Windows-0.2.1-Setup.exe | Format-List | Out-File artifacts/Ronin-Vanta-Windows-0.2.1-SHA256.txt}
          if(Test-Path artifacts/qa/private-test-profiles){Remove-Item artifacts/qa/private-test-profiles -Recurse -Force}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-vanta-windows-0.2.1
          path: |
            artifacts/*.log
            artifacts/*.zip
            artifacts/*.txt
            artifacts/qa/
            artifacts/installer/
          if-no-files-found: error
