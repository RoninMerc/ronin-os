name: Patrol Link 1.1.13 exact AnyVoiceLab recordings
on:
  push:
    branches: ['patrol-link-v123-exact-voice-pack']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: patrol-link-v123-exact
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reconstruct v1.1.12 and switch only the voice playback layer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/patrol-v123 /tmp/deliver123/evidence
          cat .patrolbuild/base.part0{0,1,2,3,4,5} | base64 -d > /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/patrol-v123
          cat .patrolbuild/overlay.part0{0,1,2} | base64 -d > /tmp/overlay.tgz
          tar -xzf /tmp/overlay.tgz -C /tmp/patrol-v123
          J=/tmp/patrol-v123/app/src/main/java/au/com/roningroup/patrollink
          cp .patrolbuild/PatrolEngine.java .patrolbuild/MainActivity.java "$J/"
          python3 .patrolbuild/v115-patch.py /tmp/patrol-v123
          mkdir -p /tmp/patrol-v123/app/src/androidTest/java/au/com/roningroup/patrollink
          cp .patrolbuild/RefreshLifecycleTest.java /tmp/patrol-v123/app/src/androidTest/java/au/com/roningroup/patrollink/
          python3 .patrolbuild/v115-finalize.py /tmp/patrol-v123
          python3 .patrolbuild/v116-patch.py /tmp/patrol-v123
          cp .patrolbuild/TlsPolicy.java "$J/"
          cp .patrolbuild/TlsPolicyTest.java /tmp/patrol-v123/app/src/test/java/au/com/roningroup/patrollink/
          cp .patrolbuild/TlsRecoveryTest.java /tmp/patrol-v123/app/src/androidTest/java/au/com/roningroup/patrollink/
          python3 .patrolbuild/v117-patch.py /tmp/patrol-v123
          python3 .patrolbuild/v121/patch.py /tmp/patrol-v123
          python3 .patrolbuild/v122/patch.py /tmp/patrol-v123
          python3 .patrolbuild/v123/patch.py /tmp/patrol-v123
          mkdir -p /tmp/patrol-v123/app/src/main/assets/exact
          cp .patrolbuild/v123/base_phrases.txt /tmp/patrol-v123/app/src/main/assets/exact/base_phrases.txt
          mkdir -p /tmp/patrol-v123/app/src/androidTest/assets
          keytool -J-Dkeystore.pkcs12.legacy -genkeypair -alias fixture -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore /tmp/patrol-v123/app/src/androidTest/assets/tls-fixture.p12 -storepass fixture-only -keypass fixture-only -dname 'CN=localhost,OU=Instrumentation fixture only,O=Test' -ext SAN=dns:localhost,ip:127.0.0.1 -ext EKU=serverAuth -validity 30 -noprompt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/patrol-v123')
          java=root/'app/src/main/java/au/com/roningroup/patrollink'
          forbidden=['android.speech.tts','TextToSpeech','com.k2fsa.sherpa.onnx','api.elevenlabs.io','xi-api-key']
          for p in java.glob('*.java'):
              s=p.read_text()
              for bad in forbidden: assert bad not in s,(p,bad)
          assert 'LocalVoiceService' not in (root/'app/src/main/AndroidManifest.xml').read_text()
          assert "versionName '1.1.13'" in (root/'app/build.gradle').read_text()
          assert 'say exactly this and nothing else' in (java/'SpeechPreferences.java').read_text()
          PY
      - name: Compile and run unit tests
        working-directory: /tmp/patrol-v123
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Browser parser regressions
        shell: bash
        run: |
          python3 -m venv /tmp/domvenv
          /tmp/domvenv/bin/pip -q install playwright
          /tmp/domvenv/bin/python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/patrol-v123/tests/test_dom.py')
          s=p.read_text().replace("shutil.which('chromium') or None", "shutil.which('chromium') or shutil.which('google-chrome') or None")
          p.write_text(s)
          PY
          /tmp/domvenv/bin/python /tmp/patrol-v123/tests/test_dom.py | tee /tmp/deliver123/evidence/DOM-TESTS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 refresh/TLS and exact WAV pack tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            cd /tmp/patrol-v123
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=au.com.roningroup.patrollink.RefreshLifecycleTest,au.com.roningroup.patrollink.TlsRecoveryTest,au.com.roningroup.patrollink.ExactPhrasePackTest
      - name: Verify package and create delivery
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/patrol-v123/app/build/outputs/apk/release/app-release.apk /tmp/deliver123/Ronin-Patrol-Link-v1.1.13-Exact-AnyVoiceLab.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs /tmp/deliver123/Ronin-Patrol-Link-v1.1.13-Exact-AnyVoiceLab.apk > /tmp/deliver123/evidence/APK-SIGNATURE.txt
          grep -q 'Signer #1 certificate SHA-256 digest: ff91d55288f1a7160e13c1affcdfef9bba89d24b2a74b0e4d7f7e923569e9332' /tmp/deliver123/evidence/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging /tmp/deliver123/Ronin-Patrol-Link-v1.1.13-Exact-AnyVoiceLab.apk > /tmp/deliver123/evidence/PACKAGE.txt
          sha256sum /tmp/deliver123/Ronin-Patrol-Link-v1.1.13-Exact-AnyVoiceLab.apk > /tmp/deliver123/evidence/SHA256SUMS.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET,json,os,hashlib
          root=Path('/tmp/patrol-v123/app/build')
          suites=[];total=0
          for folder in [root/'test-results',root/'outputs/androidTest-results']:
              for p in folder.rglob('TEST-*.xml'):
                  for s in ET.parse(p).getroot().iter('testsuite'):
                      d=dict(s.attrib)
                      assert int(d.get('failures',0))==0 and int(d.get('errors',0))==0 and int(d.get('skipped',0))==0,(p,d)
                      total+=int(d.get('tests',0));suites.append(d)
          apk=Path('/tmp/deliver123/Ronin-Patrol-Link-v1.1.13-Exact-AnyVoiceLab.apk')
          report=[
            'RONIN PATROL LINK 1.1.13 — EXACT ANYVOICELAB RECORDINGS',
            'Commit: '+os.environ['GITHUB_SHA'],'Run: '+os.environ['GITHUB_RUN_ID'],
            'APK SHA-256: '+hashlib.sha256(apk.read_bytes()).hexdigest(),
            'Tests passed: '+str(total),'',
            'VOICE ARCHITECTURE',
            'No TTS, no local voice model, no ElevenLabs, no Android system voice, no voice reconstruction.',
            'Every spoken clip is copied from the imported AnyVoiceLab PCM WAV.',
            'Phrase-pack script uses [pause 3] separators. Importer refuses a pack when detected phrase count does not exactly match the copied manifest.',
            'Playback first tries an exact full-sentence recording, otherwise joins exact recorded sentence components from the same pack.',
            'If any required phrase is absent, the update is not spoken and diagnostics name the missing exact recording.',
            'Speech-speed control changes playback rate while keeping MediaPlayer pitch at 1.0. Use 1.00x for website-original timing.',
            '',
            'WORDING',
            'An enabled full alert replacement is authoritative: Patrol Link says only the replacement text. It does not append guard, prefix or location unless the user included those words.',
            'Without a full alert replacement, nickname/prefix/alert/location formatting remains available.',
            '',
            'TEST SCOPE',
            'Android 16 emulator tested refresh/TLS recovery plus exact pause-delimited WAV splitting and rejection of mismatched manifests.',
            'No physical phone, live authenticated Silvertracker shift or AnyVoiceLab website account was used by CI.'
          ]
          Path('/tmp/deliver123/Ronin-Patrol-Link-v1.1.13-VERIFICATION.txt').write_text('\n'.join(report)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Ronin-Patrol-Link-v1.1.13-verified
          path: |
            /tmp/deliver123/Ronin-Patrol-Link-v1.1.13-Exact-AnyVoiceLab.apk
            /tmp/deliver123/Ronin-Patrol-Link-v1.1.13-VERIFICATION.txt
          retention-days: 7
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patrol-Link-v123-evidence
          path: |
            /tmp/patrol-v123/app/build/reports/
            /tmp/patrol-v123/app/build/test-results/
            /tmp/patrol-v123/app/build/outputs/androidTest-results/
            /tmp/deliver123/evidence/
          retention-days: 7
