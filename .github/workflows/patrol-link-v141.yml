name: Patrol Link v1.1.31 secure login fleet updater
on:
  push:
    branches: ['patrol-link-v141-secure-autologin-updates']
    paths:
      - '.patrolbuild/v141/**'
      - '.github/workflows/patrol-link-v141.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reconstruct verified v1.1.29 source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/patrol-link-v139.yml').read_text().splitlines()
          marker=next(i for i,s in enumerate(lines) if s.strip()=='- name: Reconstruct original project and apply requested update')
          start=next(i for i in range(marker,len(lines)) if lines[i].strip()=='run: |')+1
          end=next(i for i in range(start,len(lines)) if lines[i].startswith('      - name:'))
          script='\n'.join(s[10:] if s.startswith('          ') else s for s in lines[start:end])
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          PY
      - name: Apply v1.1.31 takeover patch
        run: |
          mkdir -p /tmp/patrol-v141-patch
          unzip -q .patrolbuild/v141/patch_bundle.zip -d /tmp/patrol-v141-patch
          python3 /tmp/patrol-v141-patch/patch.py /tmp/patrol-v134
          grep -q "versionCode 141" /tmp/patrol-v134/app/build.gradle
          grep -q "versionName '1.1.31'" /tmp/patrol-v134/app/build.gradle
          grep -q "SilvertrackerAutoLogin" /tmp/patrol-v134/app/src/main/java/au/com/roningroup/patrollink/PatrolEngine.java
          grep -q "FleetUi" /tmp/patrol-v134/app/src/main/java/au/com/roningroup/patrollink/MainActivity.java
          grep -q "REQUEST_INSTALL_PACKAGES" /tmp/patrol-v134/app/src/main/AndroidManifest.xml
      - name: Compile and run JVM tests
        working-directory: /tmp/patrol-v134
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify and package
        run: |
          set -euo pipefail
          mkdir -p /tmp/deliver141
          APK=/tmp/patrol-v134/app/build/outputs/apk/release/app-release.apk
          OUT=/tmp/deliver141/Ronin-Patrol-Link-v1.1.31-SECURE-FLEET-UPDATE.apk
          cp "$APK" "$OUT"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$OUT" > /tmp/deliver141/VERIFY.txt
          sha256sum "$OUT" | tee /tmp/deliver141/SHA256.txt
          test -s "$OUT"
      - name: Publish in-app update channel
        run: |
          set -euo pipefail
          mkdir -p dist
          cp /tmp/deliver141/Ronin-Patrol-Link-v1.1.31-SECURE-FLEET-UPDATE.apk dist/Ronin-Patrol-Link-v1.1.31.apk
          SHA=$(sha256sum dist/Ronin-Patrol-Link-v1.1.31.apk | awk '{print $1}')
          cat > dist/patrol-link-update.json <<EOF
          {
            "versionCode": 141,
            "versionName": "1.1.31",
            "apk": "https://raw.githubusercontent.com/RoninMerc/ronin-os/patrol-link-v141-secure-autologin-updates/dist/Ronin-Patrol-Link-v1.1.31.apk",
            "sha256": "$SHA"
          }
          EOF
          git config user.name "Ronin Patrol Link Build"
          git config user.email "actions@users.noreply.github.com"
          git add dist/Ronin-Patrol-Link-v1.1.31.apk dist/patrol-link-update.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Patrol Link v1.1.31 update channel"
            git push origin HEAD:patrol-link-v141-secure-autologin-updates
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Ronin-Patrol-Link-v1.1.31
          path: /tmp/deliver141/
          retention-days: 7
