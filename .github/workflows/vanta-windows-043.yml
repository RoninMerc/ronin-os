name: Ronin Vanta Windows 0.4.3 - Forge Reliability
on:
  push:
    branches: ['fix/vanta-windows-043-forge-reliability']
    paths: ['vanta/windows-043/**', '.github/workflows/vanta-windows-043.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: vanta-windows-043-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - name: Reconstruct exact delivered Windows 0.4.2 and apply native fixes
        shell: pwsh
        run: |
          $scripts=@('vanta/windows-native/materialize.py','vanta/windows-native/review.py','vanta/windows-native/apply_tests.py','vanta/windows-native/quality_review.py','vanta/windows-native/test_review.py','vanta/windows-native/finish.py','vanta/windows-native/last_review.py','vanta/windows-030/materialize.py','vanta/windows-030/compiler_repair.py','vanta/windows-040/apply.py','vanta/windows-041/apply.py','vanta/windows-041/finalize.py','vanta/windows-041/stabilize.py','vanta/windows-042/apply.py')
          foreach($script in $scripts){if(Test-Path $script){python $script;if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}}}
          python vanta/windows-043/apply.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python vanta/windows-043/finalize.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Compile native Windows client and test harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet build ronin-vanta-windows/src/Vanta.Windows/Vanta.Windows.csproj -c Release --nologo 2>&1 | Tee-Object artifacts/build.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          dotnet build ronin-vanta-windows/tests/Vanta.Tests/Vanta.Tests.csproj -c Release --nologo 2>&1 | Tee-Object artifacts/test-build.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Execute native regression and UI acceptance suite without paid API calls
        shell: pwsh
        run: |
          dotnet run --project ronin-vanta-windows/tests/Vanta.Tests/Vanta.Tests.csproj -c Release --no-build -- artifacts/qa 2>&1 | Tee-Object artifacts/test-run.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Publish self-contained Windows x64 runtime
        shell: pwsh
        run: |
          dotnet publish ronin-vanta-windows/src/Vanta.Windows/Vanta.Windows.csproj -c Release -r win-x64 --self-contained true -o artifacts/app --nologo 2>&1 | Tee-Object artifacts/publish.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          if(!(Test-Path artifacts/app/RoninVanta.exe)){throw 'Published executable missing'}
      - name: Build installer and execute original installer smoke tests
        shell: pwsh
        run: |
          & vanta/windows-043/package.ps1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Retrieve the actual verified predecessor installer
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: pwsh
        run: |
          gh run download 37292868214 --repo RoninMerc/ronin-os --name ronin-vanta-windows-0.4.2 --dir artifacts/baseline
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Upgrade the actual 0.4.2 installation and verify encrypted saved work
        shell: pwsh
        run: |
          & vanta/windows-043/upgrade.ps1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Preserve source and build identity
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -c "from pathlib import Path;import zipfile;root=Path('ronin-vanta-windows');z=zipfile.ZipFile('artifacts/Ronin-Vanta-Windows-0.4.3-Source.zip','w',zipfile.ZIP_DEFLATED);[(z.write(p,'ronin-vanta-windows/'+str(p.relative_to(root)))) for p in root.rglob('*') if p.is_file() and not {'bin','obj'}.intersection(p.parts)];z.close()"
          git rev-parse HEAD | Out-File artifacts/compiled-commit.txt
          if(Test-Path artifacts/installer/Ronin-Vanta-Windows-0.4.3-Setup.exe){Get-FileHash artifacts/installer/Ronin-Vanta-Windows-0.4.3-Setup.exe | Format-List | Out-File artifacts/installer-sha256.txt}
          if(Test-Path artifacts/qa/private-test-profiles){Remove-Item artifacts/qa/private-test-profiles -Recurse -Force}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-vanta-windows-0.4.3
          path: |
            artifacts/*.log
            artifacts/*.zip
            artifacts/*.txt
            artifacts/qa/
            artifacts/installer/
          if-no-files-found: error
  android_gate:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with: {name: ronin-vanta-windows-0.4.3, path: windows-evidence}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - uses: android-actions/setup-android@v3
      - name: Real positive and deliberately failing Android gate builds from production-prepared source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate-evidence
          fixture=$(find windows-evidence -type d -name gate-fixture | head -n 1)
          test -n "$fixture"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          gradle -p "$fixture" --no-daemon --max-workers=2 :app:assembleDebug :app:projectOwnedCheck --stacktrace 2>&1 | tee gate-evidence/positive.log
          grep -F 'VANTA_TEST_REPORT|v1|:app:testDebugUnitTest|2|2|0|0' gate-evidence/positive.log
          grep -F 'FOREIGN_SCRIPT_RETAINED' gate-evidence/positive.log
          test -f "$fixture/app/build/outputs/apk/debug/app-debug.apk"
          cp "$fixture/app/build/outputs/apk/debug/app-debug.apk" gate-evidence/gate-positive-debug.apk
          cp -r "$fixture/app/build/test-results" gate-evidence/test-results-positive
          sed -i 's/assertEquals(4, 2+2)/assertEquals(5, 2+2)/' "$fixture/app/src/test/java/au/com/ronin/gatefixture/GateTest.java"
          set +e
          gradle -p "$fixture" --no-daemon --max-workers=2 :app:assembleDebug --stacktrace >gate-evidence/negative.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -F ':app:testDebugUnitTest FAILED' gate-evidence/negative.log
          cp -r "$fixture/app/build/test-results" gate-evidence/test-results-negative
          printf 'PASS: production gate compiled an APK, executed 2 passing tests, retained project-owned script and rejected a deliberately failing test. Device/runtime testing not performed.\n' >gate-evidence/RESULT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanta-windows-043-real-gradle-gate
          path: gate-evidence/
          if-no-files-found: error
