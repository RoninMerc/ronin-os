name: Patrol Link 1.1.11 on-device speech
on:
  push:
    branches: [patrol-link-v121-ondevice-speech]
    paths: ['.github/workflows/patrol-link-v121.yml', '.patrolbuild/Voice*.java', '.patrolbuild/Local*.java', '.patrolbuild/v121*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: patrol-v121
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13', cache-read-only: false}
      - name: Reconstruct working monitor and add separate local speech process
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/patrol-v121 /tmp/deliver121 /tmp/tools121 /tmp/audio121
          cat .patrolbuild/base.part0{0,1,2,3,4,5} | base64 -d > /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/patrol-v121
          cat .patrolbuild/overlay.part0{0,1,2} | base64 -d >/tmp/overlay.tgz
          tar -xzf /tmp/overlay.tgz -C /tmp/patrol-v121
          J=/tmp/patrol-v121/app/src/main/java/au/com/roningroup/patrollink
          T=/tmp/patrol-v121/app/src/androidTest/java/au/com/roningroup/patrollink
          U=/tmp/patrol-v121/app/src/test/java/au/com/roningroup/patrollink
          cp .patrolbuild/PatrolEngine.java .patrolbuild/MainActivity.java "$J/"
          python3 .patrolbuild/v115-patch.py /tmp/patrol-v121
          mkdir -p "$T" "$U" /tmp/patrol-v121/app/src/androidTest/assets
          cp .patrolbuild/RefreshLifecycleTest.java "$T/"
          python3 .patrolbuild/v115-finalize.py /tmp/patrol-v121
          python3 .patrolbuild/v116-patch.py /tmp/patrol-v121
          cp .patrolbuild/TlsPolicy.java .patrolbuild/VoiceManager.java "$J/"
          cp .patrolbuild/TlsPolicyTest.java "$U/"
          cp .patrolbuild/TlsRecoveryTest.java "$T/"
          python3 .patrolbuild/v117-patch.py /tmp/patrol-v121
          python3 .patrolbuild/v120-patch.py /tmp/patrol-v121
          python3 .patrolbuild/v121-patch.py /tmp/patrol-v121
          cp .patrolbuild/VoiceLogicTest.java "$U/"
          cp .patrolbuild/LocalSpeechTest.java "$T/"
          keytool -J-Dkeystore.pkcs12.legacy -genkeypair -alias fixture -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore /tmp/patrol-v121/app/src/androidTest/assets/tls-fixture.p12 -storepass fixture-only -keypass fixture-only -dname 'CN=localhost,OU=Instrumentation fixture only,O=Test' -ext SAN=dns:localhost,ip:127.0.0.1 -ext EKU=serverAuth -validity 30 -noprompt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          # Transfer the existing installation's signing material encrypted, never as plaintext.
          openssl cms -encrypt -binary -aes-256-cbc -in /tmp/patrol-v121/test-signing.p12 -outform DER -out /tmp/tools121/signing.enc .patrolbuild/local-transfer.crt
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" /tmp/tools121/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" /tmp/tools121/
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt" /tmp/tools121/
          node --check /tmp/patrol-v121/app/src/main/assets/extract.js
      - name: Bundle verified offline runtime and models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/patrol-v121/app/libs /tmp/patrol-v121/app/src/main/assets/{speech-model,voices}
          curl -fL --retry 3 -o /tmp/patrol-v121/app/libs/local-speech.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo '633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  /tmp/patrol-v121/app/libs/local-speech.aar' | sha256sum -c -
          curl -fL --retry 3 -o /tmp/pocket.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-pocket-tts-int8-2026-01-26.tar.bz2
          echo '2f3b88823cbbb9bf0b2477ec8ae7b3fec417b3a87b6bb5f256dba66f2ad967cb  /tmp/pocket.tar.bz2' | sha256sum -c -
          tar -xf /tmp/pocket.tar.bz2 -C /tmp
          MODEL=/tmp/sherpa-onnx-pocket-tts-int8-2026-01-26
          ASSETS=/tmp/patrol-v121/app/src/main/assets
          cp "$MODEL"/{lm_flow.int8.onnx,lm_main.int8.onnx,encoder.onnx,decoder.int8.onnx,text_conditioner.onnx,vocab.json,token_scores.json,LICENSE,README.md} "$ASSETS/speech-model/"
          cp "$MODEL/test_wavs/bria.wav" /tmp/patrol-v121/app/src/androidTest/assets/alternate-reference.wav
          python3 - <<'PY'
          import hashlib,json,pathlib
          folder=pathlib.Path('/tmp/patrol-v121/app/src/main/assets/speech-model')
          out={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in folder.iterdir() if p.suffix=='.onnx' or p.suffix=='.json'}
          (folder/'manifest.json').write_text(json.dumps(out,indent=2))
          pathlib.Path('/tmp/deliver121/MODEL-MANIFEST.json').write_text(json.dumps(out,indent=2))
          PY
          # CI uses only the already-public Felicity samples as its reference, never the user's full uploaded recording.
          base64 -d .patrolbuild/felicity_scan.ogg.b64 >/tmp/audio121/scan.ogg
          base64 -d .patrolbuild/felicity_breach.ogg.b64 >/tmp/audio121/breach.ogg
          cat .patrolbuild/felicity_incident.ogg.b64.part* | base64 -d >/tmp/audio121/incident.ogg
          cat .patrolbuild/felicity_generic.ogg.b64.part* | base64 -d >/tmp/audio121/generic.ogg
          ffmpeg -loglevel error -i /tmp/audio121/generic.ogg -i /tmp/audio121/scan.ogg -i /tmp/audio121/breach.ogg -i /tmp/audio121/incident.ogg -filter_complex '[0:a][1:a][2:a][3:a]concat=n=4:v=0:a=1[out]' -map '[out]' -ar 24000 -ac 1 -c:a pcm_s16le "$ASSETS/voices/felicity.wav"
          curl -fL --retry 3 -o /tmp/tools121/sherpa-onnx-jvm.jar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-jvm-1.13.8.jar
          echo '77b7b047fade4eadada96b568eb92615049aaf1dc317c7244e46c1ea38b9a63b  /tmp/tools121/sherpa-onnx-jvm.jar' | sha256sum -c -
          curl -fL --retry 3 -o /tmp/tools121/sherpa-onnx-native-linux.jar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-native-lib-linux-x64-1.13.8.jar
          echo '30c93b59381113f9c20aedbbf9fc1ad399158f6bc03dddc0f8934a6e28e069ba  /tmp/tools121/sherpa-onnx-native-linux.jar' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/patrol-v121/app/src/main')
          for p in (root/'java').rglob('*.java'):
              s=p.read_text()
              for bad in ['import android.speech.tts','new TextToSpeech','api.elevenlabs','xi-api-key','tts.speak(']:
                  assert bad not in s,(p,bad)
          for name in ['VoiceManager','VoiceAudio','VoiceReadout','LocalVoiceService']:
              s=(root/'java/au/com/roningroup/patrollink'/f'{name}.java').read_text()
              for bad in ['HttpURLConnection','URLConnection','R.raw.felicity','GENERIC_START','new URL(']:
                  assert bad not in s,(name,bad)
          assert not list((root/'res/raw').glob('felicity*'))
          assert 'android:process=":voice"' in (root/'AndroidManifest.xml').read_text()
          print('No network speech calls, no system voice, no old alert resources, separate speech process verified.')
          PY
      - name: Upload local finalisation tools without plaintext secrets
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: Patrol-v121-local-tools, path: /tmp/tools121/, retention-days: 3}
      - name: Unit tests and APK compilation
        working-directory: /tmp/patrol-v121
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: DOM parser regression
        run: |
          python3 -m venv /tmp/domvenv
          /tmp/domvenv/bin/pip -q install playwright
          sed -i "s/shutil.which('chromium') or None/shutil.which('chromium') or shutil.which('google-chrome') or None/" /tmp/patrol-v121/tests/test_dom.py
          /tmp/domvenv/bin/python /tmp/patrol-v121/tests/test_dom.py | tee /tmp/deliver121/DOM-TESTS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 actual offline synthesis and monitor regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            cd /tmp/patrol-v121 && gradle --no-daemon :app:connectedDebugAndroidTest
            adb exec-out run-as au.com.roningroup.patrollink cat cache/voice-test-felicity.wav > /tmp/deliver121/CI-felicity-readout.wav
            adb exec-out run-as au.com.roningroup.patrollink cat cache/voice-test-alternate.wav > /tmp/deliver121/CI-alternate-readout.wav
      - name: Verify and package CI build
        run: |
          set -euo pipefail
          cp /tmp/patrol-v121/app/build/outputs/apk/release/app-release.apk /tmp/deliver121/Patrol-v121-CI-reference.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs /tmp/deliver121/Patrol-v121-CI-reference.apk | tee /tmp/deliver121/CI-APK-SIGNATURE.txt
          grep -q 'ff91d55288f1a7160e13c1affcdfef9bba89d24b2a74b0e4d7f7e923569e9332' /tmp/deliver121/CI-APK-SIGNATURE.txt
          sha256sum /tmp/deliver121/*.apk > /tmp/deliver121/CI-SHA256.txt
          python3 - <<'PY'
          from pathlib import Path
          import os,json,xml.etree.ElementTree as ET
          rows=[]
          for folder in ['app/build/test-results','app/build/outputs/androidTest-results']:
              for p in (Path('/tmp/patrol-v121')/folder).rglob('TEST-*.xml'):
                  for s in ET.parse(p).getroot().iter('testsuite'):
                      row=dict(s.attrib);row['file']=str(p);rows.append(row)
                      assert all(int(row.get(k,0))==0 for k in ['failures','errors','skipped']),row
          assert sum(int(r.get('tests',0)) for r in rows)>=30,rows
          out={'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'suites':rows,'scope':'Android 16 x86_64 emulator; actual offline model generation; controlled Silvertracker fixture. CI default voice reference is the previous public Felicity samples. The final original-WAV voice reference is inserted and checked locally, not uploaded to this public repository.'}
          Path('/tmp/deliver121/CI-TEST-SUMMARY.json').write_text(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: Patrol-v121-CI-build, path: /tmp/deliver121/, retention-days: 3, compression-level: 0}
      - name: Upload code and test evidence without model duplication or keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patrol-v121-evidence
          path: |
            /tmp/patrol-v121/app/build/reports/
            /tmp/patrol-v121/app/build/test-results/
            /tmp/patrol-v121/app/build/outputs/androidTest-results/
            /tmp/patrol-v121/app/src/main/java/
            /tmp/patrol-v121/app/src/main/AndroidManifest.xml
            /tmp/patrol-v121/app/src/test/java/
            /tmp/patrol-v121/app/src/androidTest/java/
            /tmp/patrol-v121/app/build.gradle
          retention-days: 3
