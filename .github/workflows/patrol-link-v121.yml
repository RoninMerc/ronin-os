name: Patrol Link 1.1.11 on-device speech
on:
  push:
    branches: [patrol-link-v121-ondevice-speech]
    paths: ['.github/workflows/patrol-link-v121.yml', '.patrolbuild/Voice*.java', '.patrolbuild/Local*.java', '.patrolbuild/v121*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: patrol-v121
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13', cache-read-only: false}
      - name: Prepare and verify offline speech build
        run: |
          bash .patrolbuild/v121-prepare.sh
          python3 .patrolbuild/v121-native-fix.py /tmp/patrol-v121
          cp .patrolbuild/VoicePlaybackTest.java /tmp/patrol-v121/app/src/androidTest/java/au/com/roningroup/patrollink/
      - name: Upload local finalisation tools without plaintext secrets
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: Patrol-v121-local-tools, path: /tmp/tools121/, retention-days: 3}
      - name: Unit tests and APK compilation
        working-directory: /tmp/patrol-v121
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
          mkdir -p /tmp/candidate121
          cp app/build/outputs/apk/release/app-release.apk /tmp/candidate121/Patrol-v121-compiled-candidate.apk
          sha256sum /tmp/candidate121/*.apk > /tmp/candidate121/SHA256.txt
          javap -classpath app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes 'au.com.roningroup.patrollink.LocalVoiceService$GenerationCallback' | tee /tmp/candidate121/JNI-CALLBACK.txt
          grep -F 'java.lang.Integer invoke(float[])' /tmp/candidate121/JNI-CALLBACK.txt
      - name: Upload compiled candidate for independent local voice verification
        uses: actions/upload-artifact@v4
        with: {name: Patrol-v121-compiled-candidate, path: /tmp/candidate121/, retention-days: 3, compression-level: 0}
      - name: DOM parser regression
        run: |
          python3 -m venv /tmp/domvenv
          /tmp/domvenv/bin/pip -q install playwright
          sed -i "s/shutil.which('chromium') or None/shutil.which('chromium') or shutil.which('google-chrome') or None/" /tmp/patrol-v121/tests/test_dom.py
          /tmp/domvenv/bin/python /tmp/patrol-v121/tests/test_dom.py | tee /tmp/deliver121/DOM-TESTS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 actual offline synthesis and playback and monitor regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            cd /tmp/patrol-v121 && gradle --no-daemon :app:connectedDebugAndroidTest
            adb exec-out run-as au.com.roningroup.patrollink cat cache/voice-test-felicity.wav > /tmp/deliver121/CI-felicity-readout.wav
            adb exec-out run-as au.com.roningroup.patrollink cat cache/voice-test-alternate.wav > /tmp/deliver121/CI-alternate-readout.wav
      - name: Verify and package CI build
        run: |
          set -euo pipefail
          cp /tmp/patrol-v121/app/build/outputs/apk/release/app-release.apk /tmp/deliver121/Patrol-v121-CI-reference.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs /tmp/deliver121/Patrol-v121-CI-reference.apk | tee /tmp/deliver121/CI-APK-SIGNATURE.txt
          grep -q 'ff91d55288f1a7160e13c1affcdfef9bba89d24b2a74b0e4d7f7e923569e9332' /tmp/deliver121/CI-APK-SIGNATURE.txt
          sha256sum /tmp/deliver121/*.apk > /tmp/deliver121/CI-SHA256.txt
          python3 - <<'PY'
          from pathlib import Path
          import os,json,xml.etree.ElementTree as ET
          rows=[]
          for folder in ['app/build/test-results','app/build/outputs/androidTest-results']:
              for p in (Path('/tmp/patrol-v121')/folder).rglob('TEST-*.xml'):
                  for s in ET.parse(p).getroot().iter('testsuite'):
                      row=dict(s.attrib);row['file']=str(p);rows.append(row)
                      assert all(int(row.get(k,0))==0 for k in ['failures','errors','skipped']),row
          assert sum(int(r.get('tests',0)) for r in rows)>=31,rows
          out={'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'suites':rows,'scope':'Android 16 x86_64 emulator; actual offline model generation, production voice queue and Android MediaPlayer playback completion, local WAV import; controlled Silvertracker fixture. CI default voice reference is the previous public Felicity samples. The final original-WAV voice reference is inserted and checked locally, not uploaded to this public repository.'}
          Path('/tmp/deliver121/CI-TEST-SUMMARY.json').write_text(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: Patrol-v121-CI-build, path: /tmp/deliver121/, retention-days: 3, compression-level: 0}
      - name: Upload code and test evidence without model duplication or keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patrol-v121-evidence
          path: |
            /tmp/patrol-v121/app/build/reports/
            /tmp/patrol-v121/app/build/test-results/
            /tmp/patrol-v121/app/build/outputs/androidTest-results/
            /tmp/patrol-v121/app/src/main/java/
            /tmp/patrol-v121/app/src/main/AndroidManifest.xml
            /tmp/patrol-v121/app/src/test/java/
            /tmp/patrol-v121/app/src/androidTest/java/
            /tmp/patrol-v121/app/build.gradle
          retention-days: 3
