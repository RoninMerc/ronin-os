name: Patrol Link 1.1.6 TLS recovery regression
on:
  push:
    branches: ['patrol-link-v116-tls-recovery']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Reconstruct v115 and apply TLS repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/patrol-v116 /tmp/deliver116
          cat .patrolbuild/base.part0{0,1,2,3,4,5} | base64 -d > /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/patrol-v116
          cat .patrolbuild/overlay.part0{0,1,2} | base64 -d > /tmp/overlay.tgz
          tar -xzf /tmp/overlay.tgz -C /tmp/patrol-v116
          cp .patrolbuild/PatrolEngine.java /tmp/patrol-v116/app/src/main/java/au/com/roningroup/patrollink/PatrolEngine.java
          cp .patrolbuild/MainActivity.java /tmp/patrol-v116/app/src/main/java/au/com/roningroup/patrollink/MainActivity.java
          python3 .patrolbuild/v115-patch.py /tmp/patrol-v116
          mkdir -p /tmp/patrol-v116/app/src/androidTest/java/au/com/roningroup/patrollink
          cp .patrolbuild/RefreshLifecycleTest.java /tmp/patrol-v116/app/src/androidTest/java/au/com/roningroup/patrollink/
          python3 .patrolbuild/v115-finalize.py /tmp/patrol-v116
          python3 .patrolbuild/v116-patch.py /tmp/patrol-v116
          cp .patrolbuild/TlsPolicy.java /tmp/patrol-v116/app/src/main/java/au/com/roningroup/patrollink/
          cp .patrolbuild/TlsPolicyTest.java /tmp/patrol-v116/app/src/test/java/au/com/roningroup/patrollink/
          cp .patrolbuild/TlsRecoveryTest.java /tmp/patrol-v116/app/src/androidTest/java/au/com/roningroup/patrollink/
          mkdir -p /tmp/patrol-v116/app/src/androidTest/assets
          keytool -J-Dkeystore.pkcs12.legacy -genkeypair -alias fixture -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore /tmp/patrol-v116/app/src/androidTest/assets/tls-fixture.p12 -storepass fixture-only -keypass fixture-only -dname 'CN=localhost,OU=Instrumentation fixture only,O=Test' -ext SAN=dns:localhost,ip:127.0.0.1 -ext EKU=serverAuth -validity 30 -noprompt
          grep -q 'versionCode 116' /tmp/patrol-v116/app/build.gradle
          grep -q "versionName '1.1.6'" /tmp/patrol-v116/app/build.gradle
          node --check /tmp/patrol-v116/app/src/main/assets/extract.js
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests and APK compilation
        working-directory: /tmp/patrol-v116
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Parser regressions in Chromium
        shell: bash
        run: |
          python3 -m venv /tmp/domvenv
          /tmp/domvenv/bin/pip -q install playwright
          /tmp/domvenv/bin/python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/patrol-v116/tests/test_dom.py')
          s=p.read_text().replace("shutil.which('chromium') or None", "shutil.which('chromium') or shutil.which('google-chrome') or None")
          p.write_text(s)
          PY
          /tmp/domvenv/bin/python /tmp/patrol-v116/tests/test_dom.py | tee /tmp/deliver116/DOM-TESTS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 TLS and automatic-refresh regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: cd /tmp/patrol-v116 && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Verify release signature and package
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/patrol-v116/app/build/outputs/apk/release/app-release.apk /tmp/deliver116/Ronin-Patrol-Link-v1.1.6-TLS-recovery.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs /tmp/deliver116/Ronin-Patrol-Link-v1.1.6-TLS-recovery.apk | tee /tmp/deliver116/APK-VERIFICATION.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/deliver116/APK-VERIFICATION.txt
          grep -q 'Signer #1 certificate SHA-256 digest: ff91d55288f1a7160e13c1affcdfef9bba89d24b2a74b0e4d7f7e923569e9332' /tmp/deliver116/APK-VERIFICATION.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging /tmp/deliver116/Ronin-Patrol-Link-v1.1.6-TLS-recovery.apk > /tmp/deliver116/PACKAGE.txt
          sha256sum /tmp/deliver116/*.apk > /tmp/deliver116/SHA256SUMS.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET, os
          lines=['Ronin Patrol Link 1.1.6','Commit: '+os.environ['GITHUB_SHA'],'Run: '+os.environ['GITHUB_RUN_ID']]
          folders=['/tmp/patrol-v116/app/build/test-results','/tmp/patrol-v116/app/build/outputs/androidTest-results']
          seen=0
          for folder in folders:
              for p in Path(folder).rglob('TEST-*.xml'):
                  root=ET.parse(p).getroot()
                  for suite in root.iter('testsuite'):
                      info={k:suite.attrib.get(k,'0') for k in ['tests','failures','errors','skipped','time']}
                      assert int(info['failures'])==0 and int(info['errors'])==0 and int(info['skipped'])==0, (p,info)
                      seen+=int(info['tests'])
                      lines.append(suite.attrib.get('name',p.name)+': '+str(info))
          assert seen>=18, ('expected unit and emulator results',seen)
          lines+=['All recorded tests passed.', 'Test scope: Android 16 emulator; controlled monitor feed; real rejected self-signed TLS connections on loopback; synthetic ERROR_FAILED_SSL_HANDSHAKE callback.', 'No authenticated live Silvertracker or physical-phone/whole-shift certification.', 'Signing certificate matches v1.1.5 for in-place personal update; previously disclosed test-key exposure is not remediated by this build.']
          Path('/tmp/deliver116/TEST-SUMMARY.txt').write_text('\n'.join(lines)+'\n')
          PY
      - name: Public endpoint certificate probe (no account session)
        shell: bash
        run: |
          python3 - <<'PY'
          import ssl,socket,json,datetime
          from pathlib import Path
          result={'tested_from':'GitHub runner; not the user phone','time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'account_used':False,'endpoints':[]}
          for host in ['trlsecurity.silvertracker.net','prod.silvertracker.net']:
              info={'host':host}
              try:
                  with socket.create_connection((host,443),timeout=7) as raw:
                      with ssl.create_default_context().wrap_socket(raw,server_hostname=host) as conn:
                          cert=conn.getpeercert()
                          info.update(verified=True,tls=conn.version(),valid_from=cert.get('notBefore'),valid_until=cert.get('notAfter'),issuer=cert.get('issuer'))
              except Exception as exc:
                  info.update(verified=False,error=type(exc).__name__+': '+str(exc))
              result['endpoints'].append(info)
          Path('/tmp/deliver116/PUBLIC-TLS-PROBE.json').write_text(json.dumps(result,indent=2))
          PY
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Ronin-Patrol-Link-v1.1.6-verified
          path: /tmp/deliver116/*
          retention-days: 7
      - name: Upload regression evidence and current source (no signing keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patrol-Link-v116-test-evidence
          path: |
            /tmp/patrol-v116/app/build/reports/
            /tmp/patrol-v116/app/build/outputs/androidTest-results/
            /tmp/patrol-v116/app/build/test-results/
            /tmp/patrol-v116/app/src/main/
            /tmp/patrol-v116/app/src/test/
            /tmp/patrol-v116/app/src/androidTest/java/
            /tmp/patrol-v116/app/build.gradle
          retention-days: 7
