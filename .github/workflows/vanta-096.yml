name: Vanta 0.9.6 - Featherless routing and request compatibility
on:
  push:
    branches: ['fix/vanta-096-featherless-routing']
    paths: ['vanta/v096/**','.github/workflows/vanta-096.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: vanta-096-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Reconstruct 0.9.5, apply reviewed 0.9.6 and build both identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('vanta/v095/ci_build.sh').read_text()
          marker="if test -f vanta/v095/final_review.py; then python3 vanta/v095/final_review.py; fi\n"
          assert s.count(marker)==1
          s=s.replace(marker,marker+"python3 vanta/v096/apply.py\npython3 vanta/v096/review.py\n",1)
          s=s.replace('Ronin-Vanta-0.9.5-Source.zip','Ronin-Vanta-0.9.6-Source.zip')
          Path('/tmp/vanta096-build.sh').write_text(s)
          PY
          bash /tmp/vanta096-build.sh
          python3 - <<'PY'
          from pathlib import Path
          import json,xml.etree.ElementTree as ET
          results=[ET.parse(p).getroot().attrib for p in Path('vanta/personal/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          count=sum(int(x.get('tests',0)) for x in results)
          assert count>=478,(count,'Expected all previous and thirteen new tests')
          assert not any(int(x.get('failures',0))+int(x.get('errors',0))+int(x.get('skipped',0)) for x in results)
          required=['app-debug.apk','app-debug-androidTest.apk','fixed-release-qa.apk','fixed-release-unsigned.apk','personal-release-unsigned.apk','baseline-094-debug.apk','field-release-qa.apk','field-test.apk','field-demo-qa.apk','field-demo-test.apk','ci_device.sh','apksigner.jar','Ronin-Vanta-0.9.6-Source.zip']
          for name in required:assert (Path('distribution')/name).is_file(),name
          Path('distribution/release-gate.json').write_text(json.dumps({'unit_tests':count,'unit_failures':0,'unit_skipped':0,'required_files':required},indent=2))
          PY
          cp client-build.log distribution/
          sha256sum distribution/*.apk > distribution/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vanta-0.9.6-build
          path: distribution/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanta-0.9.6-reports
          path: |
            client-build.log
            field-build.log
            vanta/personal/app/build/reports/
            vanta/personal/app/build/test-results/
            ${{ runner.temp }}/generated-build-evidence/
          if-no-files-found: warn
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: {api: [29,36]}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: vanta-0.9.6-build, path: distribution}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run full existing client device gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: '2048'
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          pre-emulator-launch-script: sed -i -e '/^vm.heapSize=/d' -e '/^hw.heapSize=/d' "${ANDROID_AVD_HOME}/test.avd/config.ini" && printf '\nvm.heapSize=256\n' >> "${ANDROID_AVD_HOME}/test.avd/config.ini"
          script: bash distribution/ci_device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanta-0.9.6-device-${{ matrix.api }}
          path: |
            client-*.txt
            process-*.txt
            field-*.txt
            baseline-launch.txt
            client-launch.png
            field-client-artifact.png
            client-qa-debug/
            client-qa-release/
            field-evidence/
            field-demo-evidence/
          if-no-files-found: warn
