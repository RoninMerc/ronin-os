name: Ronin Vanta 0.8.2 APK build
on:
  push:
    branches: ['build/vanta-082-apk']
    paths: ['vanta/v082/**', '.github/workflows/vanta-080.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: vanta-082-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Reconstruct verified 0.8.1 baseline
        run: |
          python3 vanta/v05/materialize.py
          curl -fL --retry 3 -o /tmp/format.jar https://repo.maven.apache.org/maven2/com/google/googlejavaformat/google-java-format/1.24.0/google-java-format-1.24.0-all-deps.jar
          find vanta/personal/app/src -name '*.java' -print0 | xargs -0 java -jar /tmp/format.jar --replace
          python3 vanta/v05/final_audit.py
          find vanta/personal/app/src -name '*.java' -print0 | xargs -0 java -jar /tmp/format.jar --replace
          python3 vanta/v06/apply_experience.py
          python3 vanta/v06/review_fixes.py
          find vanta/personal/app/src -name '*.java' -print0 | xargs -0 java -jar /tmp/format.jar --replace
          python3 vanta/v06/responsive_layout.py
          find vanta/personal/app/src -name '*.java' -print0 | xargs -0 java -jar /tmp/format.jar --replace
          python3 vanta/v07/apply_master.py
          python3 vanta/v07/review.py
          python3 vanta/v07/final_review.py
          find vanta/personal/app/src -name '*.java' -print0 | xargs -0 java -jar /tmp/format.jar --replace
          python3 vanta/v07/runtime_review.py
          find vanta/personal/app/src -name '*.java' -print0 | xargs -0 java -jar /tmp/format.jar --replace
          python3 vanta/v08/apply.py
          find vanta/personal/app/src -name '*.java' -print0 | xargs -0 java -jar /tmp/format.jar --replace
          python3 vanta/v08/apply_release.py
          python3 vanta/v08/release_review.py
          find vanta/personal/app/src -name '*.java' -print0 | xargs -0 java -jar /tmp/format.jar --replace
          python3 vanta/release/release_polish.py
          find vanta/personal/app/src -name '*.java' -print0 | xargs -0 java -jar /tmp/format.jar --replace
          python3 vanta/release/network_recovery_test.py
          find vanta/personal/app/src -name '*.java' -print0 | xargs -0 java -jar /tmp/format.jar --replace
      - name: Apply Vanta 0.8.2 fixes
        run: |
          base64 -d vanta/v082/vanta082-full.patch.gz.b64 | gzip -d > /tmp/vanta082.patch
          patch -p1 -d vanta/personal < /tmp/vanta082.patch
          grep -q "versionCode 82" vanta/personal/app/build.gradle
          grep -q "versionName '0.8.2'" vanta/personal/app/build.gradle
          grep -q 'class ModelCapabilities' vanta/personal/app/src/main/java/com/ronin/vanta/ModelCapabilities.java
          grep -q 'Change model & resume' vanta/personal/app/src/main/java/com/ronin/vanta/VantaHub.java
      - name: Compile, test, lint and package release
        shell: bash
        run: |
          set -o pipefail
          gradle -p vanta/personal --no-daemon --max-workers=2 --continue testDebugUnitTest lintDebug assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Stage update APK and signing utility
        run: |
          mkdir -p distribution
          cp vanta/personal/app/build/outputs/apk/release/app-release-unsigned.apk distribution/Ronin-Vanta-0.8.2-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" distribution/
          cd vanta/personal && zip -qr ../../distribution/Ronin-Vanta-0.8.2-Source.zip app/src app/build.gradle build.gradle settings.gradle gradle.properties
          sha256sum distribution/* > distribution/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanta-0.8.2-build
          path: |
            distribution/
            build.log
            vanta/personal/app/build/reports/
            vanta/personal/app/build/test-results/
          if-no-files-found: warn
          retention-days: 7
