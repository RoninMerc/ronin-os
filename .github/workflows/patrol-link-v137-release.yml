name: Patrol Link 1.1.27 verified release package
on:
  push:
    branches: ['patrol-link-v137-visible-copy-script']
    paths: ['.github/workflows/patrol-link-v137-release.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/download-artifact@v4
        with:
          name: Patrol-Link-v137-evidence
          run-id: 36475468562
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v137-provenance
      - name: Reconstruct identical tested source and verify recorded testcases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,xml.etree.ElementTree as E,json
          lines=Path('.github/workflows/patrol-link-v137.yml').read_text().splitlines()
          marker=next(i for i,s in enumerate(lines) if s.strip()=='- name: Reconstruct working v1.1.26 and apply copy-control patch')
          start=next(i for i in range(marker,len(lines)) if lines[i].strip()=='run: |')+1
          end=next(i for i in range(start,len(lines)) if lines[i].startswith('      - name:'))
          script='\n'.join(s[10:] if s.startswith('          ') else s for s in lines[start:end])
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          evidence=Path('/tmp/v137-provenance/patrol-v134/app')
          cases=[]
          for folder in ['build/test-results','build/outputs/androidTest-results']:
              for f in (evidence/folder).rglob('TEST-*.xml'):
                  root=E.parse(f).getroot()
                  for suite in root.iter('testsuite'):
                      assert not any(int(suite.get(k,'0')) for k in ('failures','errors','skipped')),(str(f),suite.attrib)
                  for case in root.iter('testcase'):
                      assert all(case.find(k) is None for k in ('failure','error','skipped')),case.attrib
                      cases.append(case.attrib)
          assert len(cases)==109,len(cases)
          assert len([c for c in cases if c.get('classname','').endswith('.EntireScriptCopyButtonTest')])==5
          assert len([c for c in cases if c.get('classname','').endswith('.HistoryReaderRegressionTest')])==4
          built=Path('/tmp/patrol-v134/app/src/main/java/au/com/roningroup/patrollink')
          recorded=evidence/'src/main/java/au/com/roningroup/patrollink'
          for name in ['MainActivity.java','VoiceManager.java','EntireScriptCopyUi.java']:
              assert (built/name).read_bytes()==(recorded/name).read_bytes(),name
          previous=Path('/tmp/v137-provenance/deliver137/evidence')
          for name in ['DOM-ORIGINAL.txt','DOM-HISTORY.txt']:
              text=(previous/name).read_text();assert 'PASS:' in text,text
              (Path('/tmp/deliver137/evidence')/name).write_text(text)
          assert json.loads((previous/'UNCHANGED.json').read_text())==json.loads(Path('/tmp/deliver137/evidence/UNCHANGED.json').read_text())
          Path('/tmp/deliver137/evidence/TEST-PROVENANCE.json').write_text(json.dumps({'tested_commit':'1983c470b933edeccd242c356cf7c83953994200','test_run':36475468562,'successful_cases':cases,'screenshot_export':'Optional PNG export failed after Gradle uninstalled the test app. All functional tests, including visible-button bounds and actual clipboard read-back, passed.'},indent=2))
          PY
      - name: Build release APK from the tested application source
        working-directory: /tmp/patrol-v134
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signature and write report
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/deliver137/Ronin-Patrol-Link-v1.1.27-Copy-Entire-Script.apk
          cp /tmp/patrol-v134/app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > /tmp/deliver137/evidence/APK-SIGNATURE.txt
          grep -q 'Signer #1 certificate SHA-256 digest: ff91d55288f1a7160e13c1affcdfef9bba89d24b2a74b0e4d7f7e923569e9332' /tmp/deliver137/evidence/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/deliver137/evidence/PACKAGE.txt
          sha256sum "$APK" > /tmp/deliver137/evidence/SHA256SUMS.txt
          cat > /tmp/deliver137/Ronin-Patrol-Link-v1.1.27-VERIFICATION.txt <<'EOF'
          RONIN PATROL LINK 1.1.27 - COPY ENTIRE VOICE SCRIPT

          COPY BUTTON
          Copy entire voice script is fixed at the top of Voice settings, outside the scrolling options.
          The same one-tap action is also available directly on the dashboard and in Speech controls.
          It puts the full script into ONE text clipboard item with [pause 3] separators, ready to paste.
          The visible result confirms the number of phrases copied and the source voice.

          SCRIPT CONTENT
          For a populated voice, this copies its actual installed phrase manifest: original base recordings plus all successfully imported additions in order. Replacing a recording does not add the phrase twice.
          Unimported drafts and unrelated loaded templates are not confused with the installed voice library.
          Export queues behind any in-progress WAV import and captures the source voice at the instant Copy is tapped.
          An incomplete installed library produces a clear failure instead of silently copying a stale/base-only script.
          A blank new profile can use the saved complete template; the source is explicitly identified.
          The copied phrase order is saved for Import complete-library WAV into another voice profile.

          WORKING CHECKPOINTS PRESERVED
          CheckpointTracker, PatrolEngine, HistoryPageAudit, HistoryScanGate, the DOM extractor, time parsing, feed selection, audio import and playback resolver, speech rules and all exact assets are byte-identical to reconstructed v1.1.26.
          MainActivity checkpoint and history methods are unchanged. No tally reset, sign-out or audio migration is performed.

          VERIFIED TESTS
          109 JUnit / Android 16 instrumentation testcases passed in run 36475468562 at application-source commit 1983c470b933edeccd242c356cf7c83953994200.
          15 original Chromium checks and 13 history-reader checks also passed.
          New tests clicked the actual Android button and read back the system clipboard, including all 476 phrases from a realistic-sized library fixture in one item.
          The Voice settings button was asserted fully visible without scrolling.
          Tests covered original plus multiple add-ons, phrase replacement without duplicates, preservation of source audio bytes and tally preferences, creating another voice from the saved combined template, copying while an import was pending, and corrupt-library error handling.
          The original CI run failed only an optional screenshot-export assertion: Gradle had uninstalled the test app before adb tried to retrieve its private PNG. The functional tests all passed; no retained visual screenshot is claimed.
          This release rechecked every recorded testcase, byte-compared the reconstructed MainActivity, VoiceManager and copy-control source with the tested sources, and rebuilt/signature-verified the release APK.

          INSTALL / USE
          Install over the existing Patrol Link app. Do not uninstall, clear data or reset the tally.
          Select Evelyn, tap Copy entire voice script, then paste into the voice generator.
          Create/select the new voice profile and use Import complete-library WAV for its generated recording.

          TEST BOUNDARY
          Synthetic recordings and Android 16 emulator. The actual handset, personal installed voice library and authenticated live Silvertracker session were not accessed.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: Ronin-Patrol-Link-v1.1.27-verified
          path: /tmp/deliver137/
          retention-days: 7
