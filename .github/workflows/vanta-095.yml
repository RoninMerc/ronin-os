name: Vanta 0.9.5 - field-report compiler and client acceptance
on:
  push:
    branches: ['fix/vanta-095-field-acceptance']
    paths: ['vanta/v095/**','.github/workflows/vanta-095.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: vanta-095-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build client, complete field-report app, regression fixtures and both delivery identities
        run: bash vanta/v095/ci_build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: vanta-0.9.5-build, path: distribution/, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanta-0.9.5-reports
          path: |
            client-build.log
            field-build.log
            field-demo-build.log
            vanta/personal/app/build/reports/
            vanta/personal/app/build/test-results/
            vanta/field-report/app/build/reports/
            vanta/field-report/app/build/test-results/
            ${{ runner.temp }}/generated-fixtures/
            ${{ runner.temp }}/generated-build-evidence/
          if-no-files-found: warn
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: {api: [29,36]}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: vanta-0.9.5-build, path: distribution}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Client regression, background recovery, report workflow and actual client-signed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: '2048'
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          pre-emulator-launch-script: sed -i -e '/^vm.heapSize=/d' -e '/^hw.heapSize=/d' "${ANDROID_AVD_HOME}/test.avd/config.ini" && printf '\nvm.heapSize=256\n' >> "${ANDROID_AVD_HOME}/test.avd/config.ini"
          script: bash distribution/ci_device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanta-0.9.5-device-${{ matrix.api }}
          path: |
            client-*.txt
            process-*.txt
            baseline-launch.txt
            field-*.txt
            client-launch.png
            field-client-artifact.png
            client-qa-debug/
            client-qa-release/
            field-evidence/
            field-demo-evidence/
          if-no-files-found: warn
