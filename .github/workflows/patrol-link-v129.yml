name: Patrol Link 1.1.19 adaptive checkpoints
on:
  push:
    branches: ['patrol-link-v129-adaptive-checkpoints']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: patrol-link-v129-adaptive-checkpoints
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct v1.1.16 and restore profiles with one portable WAV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/patrol-v129 /tmp/deliver129/evidence
          cat .patrolbuild/base.part0{0,1,2,3,4,5} | base64 -d > /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/patrol-v129
          cat .patrolbuild/overlay.part0{0,1,2} | base64 -d > /tmp/overlay.tgz
          tar -xzf /tmp/overlay.tgz -C /tmp/patrol-v129
          J=/tmp/patrol-v129/app/src/main/java/au/com/roningroup/patrollink
          cp .patrolbuild/PatrolEngine.java .patrolbuild/MainActivity.java "$J/"
          python3 .patrolbuild/v115-patch.py /tmp/patrol-v129
          mkdir -p /tmp/patrol-v129/app/src/androidTest/java/au/com/roningroup/patrollink
          cp .patrolbuild/RefreshLifecycleTest.java /tmp/patrol-v129/app/src/androidTest/java/au/com/roningroup/patrollink/
          python3 .patrolbuild/v115-finalize.py /tmp/patrol-v129
          python3 .patrolbuild/v116-patch.py /tmp/patrol-v129
          cp .patrolbuild/TlsPolicy.java "$J/"
          cp .patrolbuild/TlsPolicyTest.java /tmp/patrol-v129/app/src/test/java/au/com/roningroup/patrollink/
          cp .patrolbuild/TlsRecoveryTest.java /tmp/patrol-v129/app/src/androidTest/java/au/com/roningroup/patrollink/
          python3 .patrolbuild/v117-patch.py /tmp/patrol-v129
          python3 .patrolbuild/v121/patch.py /tmp/patrol-v129
          python3 .patrolbuild/v122/patch.py /tmp/patrol-v129
          python3 .patrolbuild/v123/patch.py /tmp/patrol-v129
          python3 .patrolbuild/v124/patch.py /tmp/patrol-v129
          python3 .patrolbuild/v125/patch.py /tmp/patrol-v129
          python3 .patrolbuild/v126/patch.py /tmp/patrol-v129
          python3 .patrolbuild/v127/patch.py /tmp/patrol-v129
          python3 .patrolbuild/v128/patch.py /tmp/patrol-v129
          python3 .patrolbuild/v129/patch.py /tmp/patrol-v129
          mkdir -p /tmp/patrol-v129/app/src/main/assets/exact
          cp .patrolbuild/v123/base_phrases.txt /tmp/patrol-v129/app/src/main/assets/exact/base_phrases.txt
          mkdir -p /tmp/patrol-v129/app/src/androidTest/assets
          keytool -J-Dkeystore.pkcs12.legacy -genkeypair -alias fixture -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore /tmp/patrol-v129/app/src/androidTest/assets/tls-fixture.p12 -storepass fixture-only -keypass fixture-only -dname 'CN=localhost,OU=Instrumentation fixture only,O=Test' -ext SAN=dns:localhost,ip:127.0.0.1 -ext EKU=serverAuth -validity 30 -noprompt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/patrol-v129'); java=root/'app/src/main/java/au/com/roningroup/patrollink'
          forbidden=['android.speech.tts','TextToSpeech','com.k2fsa.sherpa.onnx','api.elevenlabs.io','xi-api-key']
          for p in java.glob('*.java'):
              content=p.read_text()
              for bad in forbidden: assert bad not in content,(p,bad)
          assert "versionName '1.1.19'" in (root/'app/build.gradle').read_text()
          engine=(java/'PatrolEngine.java').read_text()
          assert 'INTERVAL = 10_000L' in engine
          assert 'BACKOFF_INTERVAL = 15_000L' in engine
          assert 'FAILURE_INTERVAL = 30_000L' in engine
          assert 'checkpoints.observe(selected)' in engine
          assert 'showCheckpointTally' in (java/'MainActivity.java').read_text()
          vm=(java/'VoiceManager.java').read_text()
          assert 'voice_profiles_v5' in vm
          assert 'DEFAULT_NAME="Evelyn"' in vm
          assert 'profiles().size()' in vm
          assert 'canonicalPhrases()' in vm
          ui=(java/'MainActivity.java').read_text()
          assert 'Add voice profile' in ui
          assert 'Copy single canonical script' in ui
          PY

      - name: Compile and unit tests
        working-directory: /tmp/patrol-v129
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Browser parser regressions
        shell: bash
        run: |
          python3 -m venv /tmp/domvenv
          /tmp/domvenv/bin/pip -q install playwright
          /tmp/domvenv/bin/python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/patrol-v129/tests/test_dom.py')
          p.write_text(p.read_text().replace("shutil.which('chromium') or None","shutil.which('chromium') or shutil.which('google-chrome') or None"))
          PY
          /tmp/domvenv/bin/python /tmp/patrol-v129/tests/test_dom.py | tee /tmp/deliver129/evidence/DOM-TESTS.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 monitor adaptive checkpoints voice regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: cd /tmp/patrol-v129 && gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=au.com.roningroup.patrollink.RefreshLifecycleTest,au.com.roningroup.patrollink.TlsRecoveryTest,au.com.roningroup.patrollink.ExactPhrasePackTest,au.com.roningroup.patrollink.SiteVoiceCoverageTest,au.com.roningroup.patrollink.SingleWavCanonicalTest,au.com.roningroup.patrollink.CheckpointTrackerTest,au.com.roningroup.patrollink.AdaptiveRefreshTest

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/deliver129/Ronin-Patrol-Link-v1.1.19-Adaptive-Checkpoint-Tally.apk
          cp /tmp/patrol-v129/app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > /tmp/deliver129/evidence/APK-SIGNATURE.txt
          grep -q 'Signer #1 certificate SHA-256 digest: ff91d55288f1a7160e13c1affcdfef9bba89d24b2a74b0e4d7f7e923569e9332' /tmp/deliver129/evidence/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/deliver129/evidence/PACKAGE.txt
          sha256sum "$APK" > /tmp/deliver129/evidence/SHA256SUMS.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET, os
          total=0
          for folder in [Path('/tmp/patrol-v129/app/build/test-results'),Path('/tmp/patrol-v129/app/build/outputs/androidTest-results')]:
              for p in folder.rglob('TEST-*.xml'):
                  for s in ET.parse(p).getroot().iter('testsuite'):
                      assert int(s.attrib.get('failures',0))==0 and int(s.attrib.get('errors',0))==0 and int(s.attrib.get('skipped',0))==0,(p,s.attrib)
                      total+=int(s.attrib.get('tests',0))
          lines=[
              'RONIN PATROL LINK 1.1.19 — ADAPTIVE REFRESH + CHECKPOINT TALLY',
              'Commit: '+os.environ['GITHUB_SHA'],
              'Run: '+os.environ['GITHUB_RUN_ID'],
              'Tests passed: '+str(total),
              '',
              'VOICE PROFILES',
              'First v1.1.19 launch has Evelyn as the only default profile; user-created profiles remain supported.',
              'Legacy Felicity profile metadata is removed and Felicity is not exposed in the UI.',
              'Users can add additional voice profiles, select them, and delete the active profile whenever at least one other profile exists.',
              'The app prevents deleting the sole remaining profile so voice settings always remain usable.',
              '',
              'SINGLE WAV',
              'Every selected profile uses one fixed canonical script and one exact WAV.',
              'The canonical phrase order is embedded in the APK and cannot change with local feed history, selected guards, or device-specific speech catalogs.',
              'The same generated WAV is therefore portable between phones running this build.',
              'The combined WAV import ceiling is raised to 512 MB and remains streamed.',
              'Each profile keeps its own single exact WAV library separate from every other profile.',
              '',
              'VOICE QUALITY',
              'No TTS, local voice reconstruction, ElevenLabs or system fallback voice is used.',
              'Playback uses only imported exact website recordings.',
              '',
              'INSTALL',
              'Install over v1.1.18. Do not uninstall or clear app data.',
              'Existing profile names are preserved where possible; generate/import the new single canonical WAV for portable exact coverage.',
              '',
              'REFRESH',
              'Normal polling interval is 10 seconds.',
              'Requests never overlap. A slow/failed refresh backs off to 15 seconds; repeated failures back off to 30 seconds.',
              'A successful read schedules the next request 10 seconds after that successful read.',
              '',
              'CHECKPOINT TALLY',
              'Tapping a guard card now opens the guard checkpoint tally instead of activity history.',
              'PBC 2: Seal/Ceil, Slipstream, Boambillee, Christina, Recreation Centre 1, Recreation Centre 2, Solo Place, Impeccable.',
              'PBC 3: Quest, Eolo, Bobsled, Elusive, Serenade.',
              'Only patrol/scan rows are counted; ordinary incidents at those properties are ignored.',
              'Issue IDs are de-duplicated and shift tallies persist across app closes until Reset shift tally is used.',
              '',
              'TEST SCOPE',
              'Compilation, unit tests, parser regressions, Android 16 refresh/TLS, fixed voice-manifest portability, adaptive cadence checks, checkpoint grouping/deduplication, and existing site coverage tests passed in CI.',
              'No physical Samsung handset or live whole-shift test.'
          ]
          Path('/tmp/deliver129/Ronin-Patrol-Link-v1.1.19-VERIFICATION.txt').write_text('\n'.join(lines)+'\n')
          PY

      - name: Publish direct APK on build branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp /tmp/deliver129/Ronin-Patrol-Link-v1.1.19-Adaptive-Checkpoint-Tally.apk dist/Ronin-Patrol-Link-v1.1.19-Adaptive-Checkpoint-Tally.apk
          git config user.name "Ronin Patrol Link Builder"
          git config user.email "actions@users.noreply.github.com"
          git add dist/Ronin-Patrol-Link-v1.1.19-Adaptive-Checkpoint-Tally.apk
          if git diff --cached --quiet; then
            echo "Direct APK already current."
          else
            git commit -m "Publish Patrol Link v1.1.19 direct APK [skip ci]"
            git push origin HEAD:patrol-link-v129-adaptive-checkpoints
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Ronin-Patrol-Link-v1.1.19-verified
          path: |
            /tmp/deliver129/Ronin-Patrol-Link-v1.1.19-Adaptive-Checkpoint-Tally.apk
            /tmp/deliver129/Ronin-Patrol-Link-v1.1.19-VERIFICATION.txt
          retention-days: 7

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patrol-Link-v129-evidence
          path: |
            /tmp/patrol-v129/app/build/reports/
            /tmp/patrol-v129/app/build/test-results/
            /tmp/patrol-v129/app/build/outputs/androidTest-results/
            /tmp/deliver129/evidence/
          retention-days: 7
