name: Mother Base cloud integration tests
on:
  push:
    branches: [trl-mother-base-v1]
    paths: ['mother-base-cloud/**', '.github/workflows/mother-base-cloud.yml']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test-only-password, POSTGRES_DB: trl_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install dependencies and run regression tests
        working-directory: mother-base-cloud
        run: npm install --ignore-scripts && npm test
      - name: Verify end-to-end relay persistence and device isolation
        working-directory: mother-base-cloud
        env:
          TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/trl_test
        run: npm run test:integration
