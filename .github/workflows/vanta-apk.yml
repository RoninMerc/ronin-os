name: Build Ronin Vanta APK
on:
  pull_request:
    paths:
      - 'vanta/**'
      - '.github/workflows/vanta-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Vanta v0.3 source package
        run: python3 vanta/apply_v03.py
      - name: Snapshot materialized source
        run: |
          cd vanta
          zip -qr /tmp/ronin-vanta-v0.3-materialized-source.zip app build.gradle gradle.properties settings.gradle
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p vanta assembleDebug --stacktrace
      - name: Run Android lint
        id: lint
        continue-on-error: true
        run: gradle -p vanta lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-vanta-v0.3-apk
          path: vanta/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-vanta-v0.3-materialized-source
          path: /tmp/ronin-vanta-v0.3-materialized-source.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-vanta-v0.3-lint
          path: |
            vanta/app/build/reports/lint-results-debug.html
            vanta/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
      - name: Enforce lint gate
        if: steps.lint.outcome != 'success'
        run: exit 1
