name: Vanta Preview - build and device QA
on:
  pull_request:
    paths:
      - 'vanta/**'
      - '.github/workflows/vanta-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vanta-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and materialize reviewed source
        run: python3 vanta/materialize_v04.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile, unit tests and lint
        run: gradle -p vanta/reviewed --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            gradle -p vanta/reviewed --no-daemon --max-workers=2 connectedDebugAndroidTest --stacktrace
            adb install -r vanta/reviewed/app/build/outputs/apk/debug/app-debug.apk
            adb install -r vanta/reviewed/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class 'com.ronin.vanta.DeviceTest#allWorkspacesOpenWithoutCredentials' com.ronin.vanta.preview.test/androidx.test.runner.AndroidJUnitRunner | tee screenshot-instrumentation.txt
            grep -Fq 'OK (1 test)' screenshot-instrumentation.txt
            adb pull /sdcard/Android/data/com.ronin.vanta.preview/files qa-previews
      - name: Collect distribution and signing verifier
        run: |
          mkdir -p vanta-distribution
          cp vanta/reviewed/app/build/outputs/apk/release/app-release-unsigned.apk vanta-distribution/
          cp vanta/reviewed/app/build/outputs/apk/debug/app-debug.apk vanta-distribution/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" vanta-distribution/
          cd vanta/reviewed && zip -qr ../../vanta-distribution/reviewed-source.zip app/src app/build.gradle build.gradle settings.gradle gradle.properties
      - uses: actions/upload-artifact@v4
        with:
          name: ronin-vanta-0.4-verified-build
          path: vanta-distribution/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-vanta-0.4-QA
          path: |
            vanta/reviewed/app/build/reports/
            vanta/reviewed/app/build/test-results/
            vanta/reviewed/app/build/outputs/androidTest-results/
            qa-previews/
            screenshot-instrumentation.txt
          if-no-files-found: warn
