name: Patrol Link v1.1.45 voice picker audit
on:
  push:
    branches: ['patrol-link-v155-voice-picker-audit']
    paths:
      - '.patrolbuild/v155/**'
      - '.github/workflows/patrol-link-v155.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reconstruct current Patrol Link source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/patrol-link-v139.yml').read_text().splitlines()
          marker=next(i for i,s in enumerate(lines) if s.strip()=='- name: Reconstruct original project and apply requested update')
          start=next(i for i in range(marker,len(lines)) if lines[i].strip()=='run: |')+1
          end=next(i for i in range(start,len(lines)) if lines[i].startswith('      - name:'))
          script='\n'.join(s[10:] if s.startswith('          ') else s for s in lines[start:end])
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          PY
          mkdir -p /tmp/patrol-v141-patch /tmp/patrol-v142-patch /tmp/patrol-v143-patch
          unzip -q .patrolbuild/v141/patch_bundle.zip -d /tmp/patrol-v141-patch
          python3 /tmp/patrol-v141-patch/patch.py /tmp/patrol-v134
          unzip -q .patrolbuild/v142/patch_bundle.zip -d /tmp/patrol-v142-patch
          python3 /tmp/patrol-v142-patch/v142_patch.py /tmp/patrol-v134
          unzip -q .patrolbuild/v143/patch_bundle.zip -d /tmp/patrol-v143-patch
          python3 /tmp/patrol-v143-patch/v143_patch.py /tmp/patrol-v134
          python3 .patrolbuild/v144/v144_patch.py /tmp/patrol-v134
          python3 .patrolbuild/v145/v145_patch.py /tmp/patrol-v134
          python3 .patrolbuild/v146/v146_patch.py /tmp/patrol-v134
          python3 .patrolbuild/v147/v147_patch.py /tmp/patrol-v134
          python3 .patrolbuild/v148/v148_patch.py /tmp/patrol-v134
          python3 .patrolbuild/v149/v149_patch.py /tmp/patrol-v134
          python3 .patrolbuild/v150/v150_patch.py /tmp/patrol-v134
          python3 .patrolbuild/v151/v151_patch.py /tmp/patrol-v134
          python3 .patrolbuild/v152/v152_patch.py /tmp/patrol-v134
          cp .patrolbuild/v153/MasterFeedSecrets.java .patrolbuild/v153/MasterFeedClient.java .patrolbuild/v153/MasterFeedUi.java /tmp/patrol-v134/app/src/main/java/au/com/roningroup/patrollink/
          python3 .patrolbuild/v153/v153_patch.py /tmp/patrol-v134
          python3 .patrolbuild/v154/v154_patch.py /tmp/patrol-v134
          python3 .patrolbuild/v155/v155_patch.py /tmp/patrol-v134
      - name: Patrol Link regression audit
        run: |
          set -euo pipefail
          J=/tmp/patrol-v134/app/src/main/java/au/com/roningroup/patrollink
          grep -q "versionCode 155" /tmp/patrol-v134/app/build.gradle
          grep -q "versionName '1.1.45'" /tmp/patrol-v134/app/build.gradle

          # Featherless models, voice dropdown, testing and uninterrupted FIFO queue
          grep -q '"hexgrad/Kokoro-82M"' "$J/FeatherlessCatalog.java"
          grep -q '"ResembleAI/chatterbox-turbo"' "$J/FeatherlessCatalog.java"
          grep -q '"Qwen/Qwen3-TTS-12Hz-1.7B-Base"' "$J/FeatherlessCatalog.java"
          grep -q '"canopylabs/orpheus-3b-0.1-ft"' "$J/FeatherlessCatalog.java"
          grep -q 'Spinner voices' "$J/FeatherlessVoiceUi.java"
          grep -q 'Test voice' "$J/FeatherlessVoiceUi.java"
          grep -q 'discoverVoicesFor' "$J/FeatherlessVoice.java"
          grep -q 'response_format","wav"' "$J/FeatherlessVoice.java"
          grep -q 'if(busy||player!=null)return' "$J/FeatherlessVoice.java"
          grep -q 'ArrayDeque<String> queue' "$J/FeatherlessVoice.java"
          grep -q 'Featherless AI · Models & voices' "$J/MainActivity.java"
          grep -q 'featherless_models_voices' "$J/SpeechSettingsUi.java"

          # Master-only SilverTrack and role controls
          grep -q 'MasterFeedClient.poll' "$J/PatrolEngine.java"
          grep -q 'MasterFeedClient.publish' "$J/PatrolEngine.java"
          grep -q 'Master / Supervisor · SilverTrack collector · no patrol assignment' "$J/FleetUi.java"
          grep -q 'patrolBlock.setVisibility(position==0?View.GONE:View.VISIBLE)' "$J/FleetUi.java"
          grep -q 'class SupervisorPin' "$J/SupervisorPin.java"

          # Checkpoint sync and current QR behaviour
          grep -q 'CheckpointSyncClient.publish' "$J/CheckpointProximityUi.java"
          grep -q 'CheckpointSyncClient.poll' "$J/CheckpointProximityUi.java"
          grep -q 'photoBase64' "$J/CheckpointProximityUi.java"
          grep -q 'button("CLOSE"' "$J/CheckpointProximityUi.java"
          ! grep -q 'CHECKPOINT COMPLETE' "$J/CheckpointProximityUi.java"
          ! grep -q 'MyCentsys' "$J/CheckpointProximityUi.java"

          # Speech corrections retained
          grep -qi 'harbourfront' "$J/SpeechRules.java"
          grep -q 'samePlace' "$J/SpeechRules.java"

          echo "AUDIT_OK: voice picker, FIFO, master feed, PIN role lock, checkpoint sync, QR close-only, no gates, Harbourfront and duplicate-place suppression are present."
      - name: Compile and run JVM tests
        working-directory: /tmp/patrol-v134
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify signing identity and package
        run: |
          set -euo pipefail
          mkdir -p /tmp/deliver155
          APK=/tmp/patrol-v134/app/build/outputs/apk/release/app-release.apk
          OUT=/tmp/deliver155/Ronin-Patrol-Link-v1.1.45-VOICE-PICKER-AUDITED.apk
          cp "$APK" "$OUT"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee /tmp/deliver155/VERIFY.txt
          grep -q 'ff91d55288f1a7160e13c1affcdfef9bba89d24b2a74b0e4d7f7e923569e9332' /tmp/deliver155/VERIFY.txt
          sha256sum "$OUT" | tee /tmp/deliver155/SHA256.txt
          echo "Audit passed: v1.1.44 signing certificate retained." > /tmp/deliver155/AUDIT.txt
      - name: Publish in-app update channel
        run: |
          set -euo pipefail
          mkdir -p dist
          cp /tmp/deliver155/Ronin-Patrol-Link-v1.1.45-VOICE-PICKER-AUDITED.apk dist/Ronin-Patrol-Link-v1.1.45.apk
          SHA=$(sha256sum dist/Ronin-Patrol-Link-v1.1.45.apk | awk '{print $1}')
          cat > dist/patrol-link-update.json <<EOF
          {
            "versionCode": 155,
            "versionName": "1.1.45",
            "apk": "https://raw.githubusercontent.com/RoninMerc/ronin-os/patrol-link-v155-voice-picker-audit/dist/Ronin-Patrol-Link-v1.1.45.apk",
            "sha256": "$SHA"
          }
          EOF
          git config user.name "Ronin Patrol Link Build"
          git config user.email "actions@users.noreply.github.com"
          git add dist/Ronin-Patrol-Link-v1.1.45.apk dist/patrol-link-update.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Patrol Link v1.1.45 audited voice picker build"
            git push origin HEAD:patrol-link-v155-voice-picker-audit
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Ronin-Patrol-Link-v1.1.45
          path: /tmp/deliver155/
          retention-days: 7
