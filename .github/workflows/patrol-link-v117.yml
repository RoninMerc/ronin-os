name: Patrol Link 1.1.7 voice library
on:
  push:
    branches: ['patrol-link-v117-voice-library']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Reconstruct v116 and apply voice library update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/patrol-v117 /tmp/deliver117
          cat .patrolbuild/base.part0{0,1,2,3,4,5} | base64 -d > /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/patrol-v117
          cat .patrolbuild/overlay.part0{0,1,2} | base64 -d > /tmp/overlay.tgz
          tar -xzf /tmp/overlay.tgz -C /tmp/patrol-v117
          cp .patrolbuild/PatrolEngine.java /tmp/patrol-v117/app/src/main/java/au/com/roningroup/patrollink/PatrolEngine.java
          cp .patrolbuild/MainActivity.java /tmp/patrol-v117/app/src/main/java/au/com/roningroup/patrollink/MainActivity.java
          python3 .patrolbuild/v115-patch.py /tmp/patrol-v117
          mkdir -p /tmp/patrol-v117/app/src/androidTest/java/au/com/roningroup/patrollink
          cp .patrolbuild/RefreshLifecycleTest.java /tmp/patrol-v117/app/src/androidTest/java/au/com/roningroup/patrollink/
          python3 .patrolbuild/v115-finalize.py /tmp/patrol-v117
          python3 .patrolbuild/v116-patch.py /tmp/patrol-v117
          cp .patrolbuild/TlsPolicy.java /tmp/patrol-v117/app/src/main/java/au/com/roningroup/patrollink/
          cp .patrolbuild/TlsPolicyTest.java /tmp/patrol-v117/app/src/test/java/au/com/roningroup/patrollink/
          cp .patrolbuild/TlsRecoveryTest.java /tmp/patrol-v117/app/src/androidTest/java/au/com/roningroup/patrollink/
          mkdir -p /tmp/patrol-v117/app/src/androidTest/assets
          keytool -J-Dkeystore.pkcs12.legacy -genkeypair -alias fixture -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore /tmp/patrol-v117/app/src/androidTest/assets/tls-fixture.p12 -storepass fixture-only -keypass fixture-only -dname 'CN=localhost,OU=Instrumentation fixture only,O=Test' -ext SAN=dns:localhost,ip:127.0.0.1 -ext EKU=serverAuth -validity 30 -noprompt

          # v1.1.7: keep the v1.1.6 refresh/TLS implementation intact; patch only UI/voice layer.
          cp .patrolbuild/VoiceManager.java /tmp/patrol-v117/app/src/main/java/au/com/roningroup/patrollink/VoiceManager.java
          python3 .patrolbuild/v117-patch.py /tmp/patrol-v117
          mkdir -p /tmp/patrol-v117/app/src/main/res/raw
          for f in scan breach incident generic; do base64 -d .patrolbuild/felicity_\${f}.ogg.b64 > /tmp/patrol-v117/app/src/main/res/raw/felicity_\${f}.ogg; done
          grep -q 'versionCode 117' /tmp/patrol-v117/app/build.gradle
          grep -q "versionName '1.1.7'" /tmp/patrol-v117/app/build.gradle
          grep -q 'class VoiceManager' /tmp/patrol-v117/app/src/main/java/au/com/roningroup/patrollink/VoiceManager.java
          test -s /tmp/patrol-v117/app/src/main/res/raw/felicity_scan.ogg
          node --check /tmp/patrol-v117/app/src/main/assets/extract.js
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests and APK compilation
        working-directory: /tmp/patrol-v117
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Parser regressions in Chromium
        shell: bash
        run: |
          python3 -m venv /tmp/domvenv
          /tmp/domvenv/bin/pip -q install playwright
          /tmp/domvenv/bin/python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/patrol-v117/tests/test_dom.py')
          s=p.read_text().replace("shutil.which('chromium') or None", "shutil.which('chromium') or shutil.which('google-chrome') or None")
          p.write_text(s)
          PY
          /tmp/domvenv/bin/python /tmp/patrol-v117/tests/test_dom.py | tee /tmp/deliver117/DOM-TESTS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 refresh/TLS regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: cd /tmp/patrol-v117 && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Verify release signature and package
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/patrol-v117/app/build/outputs/apk/release/app-release.apk /tmp/deliver117/Ronin-Patrol-Link-v1.1.7-Felicity-Voice-Library.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs /tmp/deliver117/Ronin-Patrol-Link-v1.1.7-Felicity-Voice-Library.apk | tee /tmp/deliver117/APK-VERIFICATION.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/deliver117/APK-VERIFICATION.txt
          grep -q 'Signer #1 certificate SHA-256 digest: ff91d55288f1a7160e13c1affcdfef9bba89d24b2a74b0e4d7f7e923569e9332' /tmp/deliver117/APK-VERIFICATION.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging /tmp/deliver117/Ronin-Patrol-Link-v1.1.7-Felicity-Voice-Library.apk > /tmp/deliver117/PACKAGE.txt
          sha256sum /tmp/deliver117/*.apk > /tmp/deliver117/SHA256SUMS.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET, os
          lines=['Ronin Patrol Link 1.1.7','Commit: '+os.environ['GITHUB_SHA'],'Run: '+os.environ['GITHUB_RUN_ID']]
          folders=['/tmp/patrol-v117/app/build/test-results','/tmp/patrol-v117/app/build/outputs/androidTest-results']
          seen=0
          for folder in folders:
              for p in Path(folder).rglob('TEST-*.xml'):
                  root=ET.parse(p).getroot()
                  for suite in root.iter('testsuite'):
                      info={k:suite.attrib.get(k,'0') for k in ['tests','failures','errors','skipped','time']}
                      assert int(info['failures'])==0 and int(info['errors'])==0 and int(info['skipped'])==0, (p,info)
                      seen+=int(info['tests'])
                      lines.append(suite.attrib.get('name',p.name)+': '+str(info))
          assert seen>=18, ('expected unit and emulator results',seen)
          lines += [
              'All recorded tests passed.',
              'Felicity is the built-in/default local voice profile.',
              'Voice import accepts complete 2-10 minute recordings generated from the exact Patrol Link training script and stores them only in app-private storage.',
              'Imported profiles replay the fixed event-type phrases from the training recording; this build does not run a generative voice-cloning model and does not synthesize arbitrary guard/location text in the imported voice.',
              'Voice playback is isolated from the Silvertracker 30-second refresh loop.',
              'Refresh/TLS emulator scope is unchanged from 1.1.6: controlled monitor feed, not authenticated live Silvertracker or a physical whole-shift test.',
              'Signing certificate matches v1.1.6 for in-place personal update; previously disclosed test-key exposure is not remediated by this build.'
          ]
          Path('/tmp/deliver117/TEST-SUMMARY.txt').write_text('\n'.join(lines)+'\n')
          PY
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Ronin-Patrol-Link-v1.1.7-verified
          path: /tmp/deliver117/*
          retention-days: 7
      - name: Upload regression evidence and current source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patrol-Link-v117-test-evidence
          path: |
            /tmp/patrol-v117/app/build/reports/
            /tmp/patrol-v117/app/build/outputs/androidTest-results/
            /tmp/patrol-v117/app/build/test-results/
            /tmp/patrol-v117/app/src/main/
            /tmp/patrol-v117/app/src/test/
            /tmp/patrol-v117/app/src/androidTest/java/
            /tmp/patrol-v117/app/build.gradle
          retention-days: 7
