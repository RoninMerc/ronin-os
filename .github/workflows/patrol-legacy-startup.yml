name: Verify Android 8.1 startup and publish the signed tablet repair
on:
  push:
    branches: [trl-tablet-v1.1.53]
    paths: ['.github/workflows/patrol-legacy-startup.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: patrol-v157-legacy
  cancel-in-progress: true
jobs:
  device:
    strategy:
      fail-fast: false
      matrix:
        api: [27]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: Patrol-v157-device-inputs, path: device/, run-id: 38464864976, github-token: "${{ github.token }}"}
      - name: Free space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, render, test policies and verify signed upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86
          profile: pixel_2
          target: google_apis
          ram-size: 2048M
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 1800000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell wm size 1200x1920
            adb shell wm density 160
            adb shell settings put secure location_mode 3
            adb install -r device/app-debug.apk
            adb install -r device/app-debug-androidTest.apk
            adb shell pm grant au.com.roningroup.patrollink android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant au.com.roningroup.patrollink android.permission.ACCESS_COARSE_LOCATION
            if [ "${{ matrix.api }}" -ge 33 ]; then adb shell pm grant au.com.roningroup.patrollink android.permission.POST_NOTIFICATIONS; fi
            adb shell am instrument -w -r -e class au.com.roningroup.patrollink.MonitorFilterUiTest,au.com.roningroup.patrollink.TabletDashboardTest,au.com.roningroup.patrollink.SilverTrackCaptureTest,au.com.roningroup.patrollink.BrowserUiTest,au.com.roningroup.patrollink.AutoCaptureFlowTest,au.com.roningroup.patrollink.StartupRecoveryTest au.com.roningroup.patrollink.test/androidx.test.runner.AndroidJUnitRunner | tee tablet-device-tests.txt
            python3 -c "from pathlib import Path; s=Path('tablet-device-tests.txt').read_text(); assert 'OK (35 tests)' in s and 'FAILURES' not in s and 'INSTRUMENTATION_FAILED' not in s, s"
            adb exec-out run-as au.com.roningroup.patrollink cat files/tablet-landscape-test-fixture.png > tablet-landscape-api-${{ matrix.api }}-TEST-FIXTURE.png
            adb shell wm size 900x1440
            adb shell wm density 240
            adb shell settings put system font_scale 1.15
            adb shell am instrument -w -r -e class au.com.roningroup.patrollink.TabletDashboardTest#LandscapeDashboardKeepsThreePanelsAndNativeStreetMap au.com.roningroup.patrollink.test/androidx.test.runner.AndroidJUnitRunner | tee tablet-small-screen-tests.txt
            python3 -c "from pathlib import Path; s=Path('tablet-small-screen-tests.txt').read_text(); assert 'OK (1 test)' in s and 'FAILURES' not in s, s"
            adb exec-out run-as au.com.roningroup.patrollink cat files/tablet-landscape-test-fixture.png > tablet-small-api-${{ matrix.api }}-TEST-FIXTURE.png
            adb shell wm size 1080x1920
            adb shell wm density 480
            adb shell settings put system font_scale 1.0
            adb shell am instrument -w -r -e class au.com.roningroup.patrollink.DisplayModeTest au.com.roningroup.patrollink.test/androidx.test.runner.AndroidJUnitRunner | tee phone-display-mode-tests.txt
            python3 -c "from pathlib import Path; s=Path('phone-display-mode-tests.txt').read_text(); assert 'OK (1 test)' in s and 'FAILURES' not in s and 'INSTRUMENTATION_FAILED' not in s, s"
            adb exec-out run-as au.com.roningroup.patrollink cat files/phone-landscape-TEST-FIXTURE.png > phone-landscape-api-${{ matrix.api }}-TEST-FIXTURE.png
            adb shell wm size 1200x1920
            adb shell wm density 160
            adb shell settings put system font_scale 1.0
            adb uninstall au.com.roningroup.patrollink.test
            adb uninstall au.com.roningroup.patrollink
            adb install device/baseline.apk
            if [ "${{ matrix.api }}" -ge 33 ]; then adb shell pm grant au.com.roningroup.patrollink android.permission.POST_NOTIFICATIONS; fi
            adb install device/tablet-probe-signed.apk
            adb shell am instrument -w -r -e class au.com.roningroup.patrollink.TabletUpgradeTest#writeBaseline au.com.roningroup.patrollink.test/androidx.test.runner.AndroidJUnitRunner | tee upgrade-baseline-tests.txt
            python3 -c "from pathlib import Path; s=Path('upgrade-baseline-tests.txt').read_text(); assert 'OK (1 test)' in s and 'FAILURES' not in s, s"
            adb install -r device/release.apk
            adb shell am instrument -w -r -e class au.com.roningroup.patrollink.TabletUpgradeTest#verifyUpgradeAndLaunchTablet au.com.roningroup.patrollink.test/androidx.test.runner.AndroidJUnitRunner | tee upgrade-release-tests.txt
            python3 -c "from pathlib import Path; s=Path('upgrade-release-tests.txt').read_text(); assert 'OK (1 test)' in s and 'FAILURES' not in s, s"
            for attempt in 1 2 3; do
              adb shell am force-stop au.com.roningroup.patrollink
              adb shell am start -W -n au.com.roningroup.patrollink/.MainActivity
              sleep 6
              adb shell uiautomator dump /data/local/tmp/trl-cold-start.xml
              adb pull /data/local/tmp/trl-cold-start.xml /tmp/trl-cold-start.xml
              python3 -c "import xml.etree.ElementTree as E; nodes=list(E.parse('/tmp/trl-cold-start.xml').iter('node')); ids={n.get('resource-id','') for n in nodes}; texts=[n.get('text','').upper() for n in nodes]; assert all(any(('PATROL '+str(i)) in t for t in texts) for i in (1,2,3)), 'Three native patrol panels missing after cold launch'"
            done
            echo 'Three release force-stop/relaunch checks passed; no app data cleared' > release-cold-start-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Patrol-v157-device-results-${{ matrix.api }}
          path: |
            *-tests.txt
            *-TEST-FIXTURE.png
          retention-days: 30
  publish:
    needs: [device]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: TRL-Patrol-Link-v1.1.57-delivery, path: release/, run-id: 38464864976, github-token: "${{ github.token }}"}
      - name: Wait for retained API30 and API35 checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess,time
          for attempt in range(24):
              data=json.loads(subprocess.check_output(['gh','api','repos/RoninMerc/ronin-os/actions/runs/38464864976/jobs']))
              checks=[j for j in data['jobs'] if j['name'] in ['device (30)','device (35)']]
              if len(checks)==2 and all(j['status']=='completed' for j in checks):
                  assert all(j['conclusion']=='success' for j in checks), 'Retained device checks failed'
                  break
              time.sleep(30)
          else: raise RuntimeError('Retained device checks did not finish')
          PY
      - uses: actions/download-artifact@v4
        with: {name: Patrol-v157-device-results-30, path: device-results/Patrol-v157-device-results-30, run-id: 38464864976, github-token: "${{ github.token }}"}
      - uses: actions/download-artifact@v4
        with: {name: Patrol-v157-device-results-35, path: device-results/Patrol-v157-device-results-35, run-id: 38464864976, github-token: "${{ github.token }}"}
      - uses: actions/download-artifact@v4
        with: {name: Patrol-v157-device-results-27, path: device-results/Patrol-v157-device-results-27}
      - name: Collect API-specific results and fixture screenshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil,json,re
          out=Path('release');assert json.loads((out/'JVM-TESTS.json').read_text())['passed']==95
          total=0
          for d in Path('device-results').iterdir():
              if not d.is_dir():continue
              api=d.name.split('-')[-1]
              for p in d.iterdir():
                  if p.is_file() and (p.name.endswith('-tests.txt') or p.name.endswith('-TEST-FIXTURE.png')):
                      shutil.copyfile(p,out/(p.name if p.suffix=='.png' else 'API-'+api+'-'+p.name))
                      if p.suffix=='.txt':
                          s=p.read_text();assert 'FAILURES' not in s and 'INSTRUMENTATION_FAILED' not in s
                          if p.name=='release-cold-start-tests.txt':
                              assert 'Three release force-stop/relaunch checks passed' in s;continue
                          matches=re.findall(r'OK \((\d+) tests?\)',s);assert matches;total+=int(matches[-1])
          assert total==117
          (out/'CONFIRMED-TEST-RESULTS.md').write_text("# Confirmed verification — 1.1.57/code169\n\nRelease/debug/instrumentation APKs compiled. 95 JVM checks passed. 117 emulator checks passed across APIs 27, 30 and 35, including actual signed upgrades from 1.1.52, large/small tablet rendering, real production Phone/Tablet/Auto switching on a 360 dp phone, persistence and patrol-panel bounds. The sanitized full source independently compiled and passed its JVM suite. Tablet-only TRL styling and automatic paging, actual WebView detail read through publication/evidence receipts with synthetic transports, retry behavior, original phone toolbar, source photo URL policy, satellite tile addressing, full-page browser/overview scaling, multiple reported-issue filtering, nested/DIV/JavaScript report links, hidden-login/frame fields, precise source date extraction, read-only URL guards and Publisher pairing feedback were checked. Startup recovery fault injection for engine, browser and map plus interrupted construction was checked. Original certificate/package, encrypted Reader pairing, guard/checkpoint/voice state and UID were verified through upgrade.\n\nGPS positions used for automated map/proximity checks are synthetic fixtures. Actual Ronin Forge mirroring/car-monitor scaling, field GPS accuracy, live fleet reception, physical QR/source capture and background battery behavior need physical verification.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TRL-Patrol-Link-v1.1.57-APK-AND-REPORTS
          path: release/
          retention-days: 30
      - name: Publish the verified operational APK and complete source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin f7f53c78dc1f7674316b21e9223c5acb97247324
          git tag trl-patrol-link-v1.1.57-startup-recovery-tablet f7f53c78dc1f7674316b21e9223c5acb97247324
          git push origin refs/tags/trl-patrol-link-v1.1.57-startup-recovery-tablet
          gh release create trl-patrol-link-v1.1.57-startup-recovery-tablet --repo "$GITHUB_REPOSITORY" --target f7f53c78dc1f7674316b21e9223c5acb97247324 --prerelease --title "TRL Patrol Link 1.1.57 — Startup recovery and TRL satellite tablet dashboard" --notes-file .tabletbuild/INSTALL-TABLET.md release/*
