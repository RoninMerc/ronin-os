name: Vanta Android 0.17.6 - Semantic stream progress
on:
  push:
    branches: ['fix/vanta-0176-stream-progress']
    paths: ['vanta/v0176/**', '.github/workflows/vanta-0176.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: vanta-0176-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: vanta-0.17.5-build
          run-id: 37365147546
          github-token: ${{ github.token }}
          path: baseline
      - name: Patch the exact delivered Android source
        run: |
          set -euo pipefail
          echo 'e307081961473e37b14e7fc7d575fcc152eb2aa477b40194dad3cfbb404add3d  baseline/Ronin-Vanta-0.17.5-Source.zip' | sha256sum -c -
          mkdir source distribution
          unzip -q baseline/Ronin-Vanta-0.17.5-Source.zip -d source
          python3 vanta/v0176/apply.py source
          sed -i 's/assertEquals("0.17.5"/assertEquals("0.17.6"/' source/app/src/androidTest/java/com/ronin/vanta/Vanta175UpgradeDeviceTest.java
      - name: Real compilation, retained regressions, stream regressions and lint
        run: |
          set -o pipefail
          gradle -p source --no-daemon --max-workers=2 --continue testDebugUnitTest testReleaseUnitTest lintDebug assembleRelease assembleDebugAndroidTest --stacktrace 2>&1 | tee build.log
      - name: Stage unchanged unsigned payloads and a QA-signed upgrade pair
        run: |
          set -euo pipefail
          cp source/app/build/outputs/apk/release/app-release-unsigned.apk distribution/fixed-release-unsigned.apk
          cp source/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk distribution/tests.apk
          cp baseline/apksigner.jar distribution/
          gradle -p source --no-daemon --console=plain signingReport > /tmp/signing.txt
          KEY=$(sed -n 's/^Store: //p' /tmp/signing.txt | grep -v '^null$' | head -n1)
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" sign --ks "$KEY" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out distribution/release-qa.apk distribution/fixed-release-unsigned.apk
          "$SIGNER" sign --ks "$KEY" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out distribution/baseline-qa.apk baseline/fixed-release-unsigned.apk
          "$SIGNER" verify --verbose --print-certs distribution/release-qa.apk > distribution/qa-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging distribution/release-qa.apk > distribution/package.txt
          gradle -p source -PvantaApplicationId=com.ronin.vanta.personal --no-daemon --max-workers=2 assembleRelease --stacktrace 2>&1 | tee personal-build.log
          cp source/app/build/outputs/apk/release/app-release-unsigned.apk distribution/personal-release-unsigned.apk
          printf '%s\n' "$GITHUB_SHA" > distribution/source-commit.txt
          sha256sum distribution/*.apk > distribution/SHA256SUMS.txt
      - name: Preserve exact source and executed results
        if: always()
        run: |
          mkdir -p distribution
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('source')
          with zipfile.ZipFile('distribution/Ronin-Vanta-0.17.6-Source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in root.rglob('*'):
              if p.is_file() and not {'.gradle','build'}.intersection(p.relative_to(root).parts): z.write(p,p.relative_to(root))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: vanta-0.17.6-build, path: distribution/, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanta-0.17.6-reports
          path: |
            *build.log
            source/app/build/reports/
            source/app/build/test-results/
          if-no-files-found: warn
  phone_upgrade:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: vanta-0.17.6-build, path: distribution}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: In-place upgrade preserves encrypted data and build checkpoint
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: '3072'
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          pre-emulator-launch-script: sed -i -e '/^vm.heapSize=/d' -e '/^hw.heapSize=/d' "${ANDROID_AVD_HOME}/test.avd/config.ini" && printf '\nvm.heapSize=256\n' >> "${ANDROID_AVD_HOME}/test.avd/config.ini"
          script: bash vanta/v0175/device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: vanta-0.17.6-phone-upgrade, path: device-evidence/, if-no-files-found: warn}
