name: Vanta 0.6 release APK and layout verification
on:
  push:
    branches: ['build/vanta-experience-06']
    paths: ['.github/workflows/vanta-experience-release.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  release-device:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vanta-0.6-build
          run-id: 34167657696
          github-token: ${{ github.token }}
          path: distribution
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Sign release and instrumentation with a disposable QA identity
        shell: bash
        run: |
          keytool -genkeypair -alias qa -keystore "$RUNNER_TEMP/qa.p12" -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 1 -storepass changeit -keypass changeit -dname 'CN=Vanta ephemeral QA'
          java -jar distribution/apksigner.jar sign --ks "$RUNNER_TEMP/qa.p12" --ks-pass pass:changeit --key-pass pass:changeit --out distribution/release-qa.apk distribution/fixed-release-unsigned.apk
          java -jar distribution/apksigner.jar sign --ks "$RUNNER_TEMP/qa.p12" --ks-pass pass:changeit --key-pass pass:changeit --out distribution/test-qa.apk distribution/app-debug-androidTest.apk
          java -jar distribution/apksigner.jar verify --verbose --print-certs distribution/release-qa.apk > release-qa-signature.txt
          echo 'Release payload from source 2becb41c3736c90e0db037c6e7b7dac7b65b13af, run 34167657696. Disposable QA signature only; no owner key present.' > release-provenance.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare layout smoke checks
        shell: bash
        run: |
          cat > /tmp/layout-check.py <<'PY'
          import subprocess, pathlib, time, re, xml.etree.ElementTree as ET
          out=pathlib.Path('release-layout');out.mkdir(exist_ok=True)
          def adb(*args): return subprocess.check_output(['adb',*args])
          def launch():
              adb('shell','am','force-stop','com.ronin.vanta.fixed')
              adb('shell','am','start','-W','-n','com.ronin.vanta.fixed/com.ronin.vanta.MainActivity');time.sleep(1)
          def snapshot(name):
              (out/(name+'.png')).write_bytes(adb('exec-out','screencap','-p'))
              adb('shell','uiautomator','dump','/sdcard/vanta-layout.xml')
              raw=adb('exec-out','cat','/sdcard/vanta-layout.xml');(out/(name+'.xml')).write_bytes(raw)
              tree=ET.fromstring(raw)
              fields=[n for n in tree.iter('node') if n.attrib.get('class')=='android.widget.EditText' and n.attrib.get('package')=='com.ronin.vanta.fixed']
              if not fields:raise RuntimeError(name+': composer missing')
              return fields[0]
          try:
              launch();snapshot('release-normal')
              adb('shell','settings','put','system','font_scale','1.3');launch();field=snapshot('release-large-text')
              bounds=list(map(int,re.findall(r'\d+',field.attrib['bounds'])))
              adb('shell','input','tap',str((bounds[0]+bounds[2])//2),str((bounds[1]+bounds[3])//2));time.sleep(.8)
              adb('shell','input','text','Keyboard%ssmoke%stest');time.sleep(.4);snapshot('release-keyboard')
              adb('shell','input','keyevent','4');time.sleep(.3)
              adb('shell','settings','put','system','accelerometer_rotation','0')
              adb('shell','settings','put','system','user_rotation','1');time.sleep(2);snapshot('release-landscape')
              print('Release startup, 1.3x text, keyboard and landscape composer checks passed.')
          finally:
              adb('shell','settings','put','system','font_scale','1.0')
              adb('shell','settings','put','system','user_rotation','0')
              adb('shell','settings','put','system','accelerometer_rotation','1')
          PY
      - name: Run full instrumentation against release variant and layout checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb install -r distribution/release-qa.apk
            adb install -r distribution/test-qa.apk
            adb logcat -c
            adb shell am instrument -w -r com.ronin.vanta.fixed.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation-release-${{ matrix.api }}.txt
            adb pull /sdcard/Android/data/com.ronin.vanta.fixed/files release-suite-previews || true
            grep -Eq '^OK \([0-9]+ tests?\)' instrumentation-release-${{ matrix.api }}.txt
            python3 /tmp/layout-check.py | tee layout-check.txt
            adb logcat -d > logcat-release-${{ matrix.api }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanta-0.6-release-device-${{ matrix.api }}
          path: |
            instrumentation-release-*.txt
            logcat-release-*.txt
            release-suite-previews/
            release-layout/
            layout-check.txt
            release-provenance.txt
            release-qa-signature.txt
          if-no-files-found: error
