name: Vanta 0.9.1 client compilation and unit tests
on:
  push:
    branches: ['fix/vanta-091-forge-reliability']
    paths: ['vanta/v091/**', '.github/workflows/vanta-091.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Reconstruct Vanta baseline
        run: |
          python3 vanta/v05/materialize.py
          curl -fL --retry 3 -o /tmp/format.jar https://repo.maven.apache.org/maven2/com/google/googlejavaformat/google-java-format/1.24.0/google-java-format-1.24.0-all-deps.jar
          format() { find vanta/personal/app/src -name '*.java' -print0 | xargs -0 java -jar /tmp/format.jar --replace; }
          format
          python3 vanta/v05/final_audit.py
          format
          python3 vanta/v06/apply_experience.py
          python3 vanta/v06/review_fixes.py
          format
          python3 vanta/v06/responsive_layout.py
          format
          python3 vanta/v07/apply_master.py
          python3 vanta/v07/review.py
          python3 vanta/v07/final_review.py
          format
          python3 vanta/v07/runtime_review.py
          format
          python3 vanta/v08/apply.py
          format
          python3 vanta/v08/apply_release.py
          python3 vanta/v08/release_review.py
          format
          python3 vanta/release/release_polish.py
          format
          python3 vanta/release/network_recovery_test.py
          format
          base64 -d vanta/v082/vanta082-full.patch.gz.b64 | gzip -d > /tmp/082.patch
          patch -p1 -d vanta/personal < /tmp/082.patch
          base64 -d vanta/v083/vanta083-on-082.patch.gz.b64 | gzip -d > /tmp/083.patch
          patch -p1 -d vanta/personal < /tmp/083.patch
          format
          python3 vanta/v09/apply.py
          python3 vanta/v09/review.py
          format
          python3 vanta/v091/apply.py
          if test -f vanta/v091/review.py; then python3 vanta/v091/review.py; fi
          format
      - name: Compile Vanta only, run unit tests and lint
        run: gradle -p vanta/personal --no-daemon --max-workers=2 --continue testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Preserve Vanta build and source
        if: always()
        run: |
          mkdir -p distribution
          test ! -f vanta/personal/app/build/outputs/apk/release/app-release-unsigned.apk || cp vanta/personal/app/build/outputs/apk/release/app-release-unsigned.apk distribution/
          test ! -f vanta/personal/app/build/outputs/apk/debug/app-debug.apk || cp vanta/personal/app/build/outputs/apk/debug/app-debug.apk distribution/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" distribution/
          cd vanta/personal && zip -qr ../../distribution/Ronin-Vanta-0.9.1-Source.zip app/src app/build.gradle build.gradle settings.gradle gradle.properties
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: vanta-0.9.1-client-build, path: distribution/, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanta-0.9.1-client-reports
          path: |
            vanta/personal/app/build/reports/
            vanta/personal/app/build/test-results/
          if-no-files-found: warn
