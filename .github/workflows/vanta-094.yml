name: Vanta 0.9.4 transport recovery and real compiler verification
on:
  push:
    branches: ['fix/vanta-094-transport-recovery']
    paths: ['vanta/v094/**', '.github/workflows/vanta-094.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: vanta-094-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Initialize isolated verification paths
        run: |
          echo "VANTA_FIXTURES_OUT=$RUNNER_TEMP/generated-fixtures" >> "$GITHUB_ENV"
          echo "VANTA_BUILD_EVIDENCE=$RUNNER_TEMP/generated-build-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Reconstruct exact baseline and apply reviewed transport changes
        run: |
          python3 vanta/v05/materialize.py
          curl -fL --retry 3 -o /tmp/format.jar https://repo.maven.apache.org/maven2/com/google/googlejavaformat/google-java-format/1.24.0/google-java-format-1.24.0-all-deps.jar
          format() { find vanta/personal/app/src -name '*.java' -print0 | xargs -0 java -jar /tmp/format.jar --replace; }
          format
          python3 vanta/v05/final_audit.py
          format
          python3 vanta/v06/apply_experience.py
          python3 vanta/v06/review_fixes.py
          format
          python3 vanta/v06/responsive_layout.py
          format
          python3 vanta/v07/apply_master.py
          python3 vanta/v07/review.py
          python3 vanta/v07/final_review.py
          format
          python3 vanta/v07/runtime_review.py
          format
          python3 vanta/v08/apply.py
          format
          python3 vanta/v08/apply_release.py
          python3 vanta/v08/release_review.py
          format
          python3 vanta/release/release_polish.py
          format
          python3 vanta/release/network_recovery_test.py
          format
          base64 -d vanta/v082/vanta082-full.patch.gz.b64 | gzip -d > /tmp/082.patch
          patch -p1 -d vanta/personal < /tmp/082.patch
          base64 -d vanta/v083/vanta083-on-082.patch.gz.b64 | gzip -d > /tmp/083.patch
          patch -p1 -d vanta/personal < /tmp/083.patch
          format
          python3 vanta/v09/apply.py
          python3 vanta/v09/review.py
          format
          python3 vanta/v091/apply.py
          python3 vanta/v091/review.py
          format
          python3 vanta/v092/apply.py
          python3 vanta/v092/review.py
          format
          python3 vanta/v093/apply.py
          format
          python3 vanta/v094/apply.py
          if test -f vanta/v094/review.py; then python3 vanta/v094/review.py; fi
          format
          gradle -p vanta/personal --no-daemon --max-workers=2 wrapper --gradle-version 8.13
          mkdir -p distribution
          printf '%s\n' "$GITHUB_SHA" > distribution/source-commit.txt
          cd vanta/personal && zip -qr ../../distribution/Ronin-Vanta-0.9.4-Source.zip app/src app/build.gradle build.gradle settings.gradle gradle.properties gradle gradlew gradlew.bat ci
      - name: Compile Vanta, run all unit/provider tests and lint
        shell: bash
        run: |
          set -o pipefail
          gradle -p vanta/personal --no-daemon --max-workers=2 --continue testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease --stacktrace 2>&1 | tee client-build.log
      - name: Prepare compiled update tracks and release payload QA
        run: |
          cp vanta/personal/app/build/outputs/apk/debug/app-debug.apk distribution/
          cp vanta/personal/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk distribution/
          cp vanta/personal/app/build/outputs/apk/release/app-release-unsigned.apk distribution/fixed-release-unsigned.apk
          gradle -p vanta/personal --no-daemon --console=plain signingReport > /tmp/client-signing-report.txt
          QA_KEY=$(sed -n 's/^Store: //p' /tmp/client-signing-report.txt | grep -v '^null$' | head -n1)
          test -f "$QA_KEY"
          printf '%s\n' "QA_KEY=$QA_KEY" >> "$GITHUB_ENV"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$QA_KEY" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out distribution/client-release-qa.apk distribution/fixed-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs distribution/client-release-qa.apk > distribution/client-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging distribution/client-release-qa.apk > distribution/client-package.txt
          gradle -p vanta/personal -PvantaApplicationId=com.ronin.vanta.personal --no-daemon --max-workers=2 assembleRelease --stacktrace
          cp vanta/personal/app/build/outputs/apk/release/app-release-unsigned.apk distribution/personal-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging distribution/personal-release-unsigned.apk > distribution/personal-package.txt
      - name: Reproduce configuration, dependency, LiveData test compilation and assertion failures; repair and build actual generated APK
        run: python3 vanta/personal/ci/verify_generated_builds.py
      - name: Sign freshly compiled neutral application for device launch
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$QA_KEY" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out distribution/generated-foundation-qa.apk "$VANTA_BUILD_EVIDENCE/generated-foundation-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs distribution/generated-foundation-qa.apk > distribution/generated-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging distribution/generated-foundation-qa.apk > distribution/generated-package.txt
      - name: Preserve packaging evidence
        if: always()
        run: |
          mkdir -p distribution
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" distribution/
          cp /tmp/format.jar distribution/
          sha256sum distribution/*.apk > distribution/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: vanta-0.9.4-build, path: distribution/, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanta-0.9.4-reports
          path: |
            client-build.log
            vanta/personal/app/build/reports/
            vanta/personal/app/build/test-results/
            ${{ runner.temp }}/generated-fixtures/
            ${{ runner.temp }}/generated-build-evidence/
          if-no-files-found: warn
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: {api: [29, 36]}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: vanta-0.9.4-build, path: distribution}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Full client and real HTTPS disconnect regressions, background/process restoration, generated APK launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: '2048'
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          pre-emulator-launch-script: sed -i -e '/^vm.heapSize=/d' -e '/^hw.heapSize=/d' "${ANDROID_AVD_HOME}/test.avd/config.ini" && printf '\nvm.heapSize=256\n' >> "${ANDROID_AVD_HOME}/test.avd/config.ini"
          script: |
            adb install -r distribution/app-debug.apk
            adb install -r distribution/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -r -e notClass com.ronin.vanta.ProcessProbe com.ronin.vanta.fixed.test/androidx.test.runner.AndroidJUnitRunner | tee client-debug-tests.txt
            adb logcat -d > client-debug-logcat.txt
            adb pull /sdcard/Android/data/com.ronin.vanta.fixed/files client-qa-debug || true
            grep -Eq '^OK \([0-9]+ tests?\)' client-debug-tests.txt
            adb shell am instrument -w -r -e class com.ronin.vanta.ProcessProbe#prepare com.ronin.vanta.fixed.test/androidx.test.runner.AndroidJUnitRunner | tee client-process-prepare.txt
            grep -Eq '^OK \([0-9]+ tests?\)' client-process-prepare.txt
            adb shell am force-stop com.ronin.vanta.fixed
            adb shell am start -n com.ronin.vanta.fixed/com.ronin.vanta.MainActivity
            sleep 3
            adb shell am instrument -w -r -e class com.ronin.vanta.ProcessProbe#verify com.ronin.vanta.fixed.test/androidx.test.runner.AndroidJUnitRunner | tee client-process-restore.txt
            grep -Eq '^OK \([0-9]+ tests?\)' client-process-restore.txt
            adb install -r distribution/client-release-qa.apk
            adb logcat -c
            adb shell am instrument -w -r -e notClass com.ronin.vanta.ProcessProbe,com.ronin.vanta.BackgroundDeviceTest com.ronin.vanta.fixed.test/androidx.test.runner.AndroidJUnitRunner | tee client-release-tests.txt
            adb logcat -d > client-release-logcat.txt
            adb pull /sdcard/Android/data/com.ronin.vanta.fixed/files client-qa-release || true
            grep -Eq '^OK \([0-9]+ tests?\)' client-release-tests.txt
            adb shell am force-stop com.ronin.vanta.fixed
            adb shell am start -W -n com.ronin.vanta.fixed/com.ronin.vanta.MainActivity | tee client-launch.txt
            adb exec-out screencap -p > client-launch.png
            adb install -r distribution/generated-foundation-qa.apk
            adb shell am start -W -n com.ronin.forge.foundationcheck/.MainActivity | tee generated-launch.txt
            grep -q 'Status: ok' generated-launch.txt
            sleep 2
            adb shell dumpsys activity activities > generated-activity.txt
            adb exec-out screencap -p > generated-launch.png
            adb shell dumpsys package com.ronin.vanta.fixed > client-installed-package.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanta-0.9.4-device-${{ matrix.api }}
          path: |
            client-*.txt
            client-launch.png
            client-qa-debug/
            client-qa-release/
            generated-*.txt
            generated-launch.png
          if-no-files-found: warn
