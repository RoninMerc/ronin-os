name: ronin-remote-link

services:
  hbbs:
    container_name: ronin-remote-hbbs
    image: ghcr.io/rustdesk/rustdesk-server:${RUSTDESK_SERVER_VERSION:-1.1.16}
    command: hbbs -r ${PUBLIC_HOST}:21117
    volumes:
      - ./data:/root
    ports:
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"
    depends_on:
      - hbbr
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ronin_remote

  hbbr:
    container_name: ronin-remote-hbbr
    image: ghcr.io/rustdesk/rustdesk-server:${RUSTDESK_SERVER_VERSION:-1.1.16}
    command: hbbr
    volumes:
      - ./data:/root
    ports:
      - "21117:21117/tcp"
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ronin_remote

networks:
  ronin_remote:
    name: ronin_remote_link
